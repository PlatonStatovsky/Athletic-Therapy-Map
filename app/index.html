<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">

<script>try{var t=localStorage.getItem('uqmap-theme');if(t==='light'||t==='comfort'||t==='dark')document.documentElement.dataset.theme=t;else if(!matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='comfort'}catch(e){}</script>
<style>
/* themes: light (default), dark, comfort ("נוח לעין": warm paper, softer contrast, less blue light).
   data-theme on <html> forces one; without it the system setting decides between light and dark. */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#eeebe4; --ink:#1c2321; --ink-2:#5a6360; --line:#dbd6cc;
  --accent:#0f5c5c; --accent-ink:#ffffff; --accent-soft:#dbeae7;
  --rec:#c0352a; --rec-soft:#f8dfdb; --warn:#9a5800; --warn-soft:#fbeccf; --ok:#2c6a3d; --ok-soft:#dcefe0;
  --hl-done:#d4f0db; --hl-done-ink:#1d5a2f; --hl-rec:#ffe2b8; --hl-rec-ink:#7a4300; --hl-must:#ffd3cc; --hl-must-ink:#8e1f15;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#111514; --surface:#1a201f; --surface-2:#222928; --ink:#e7ecea; --ink-2:#a1aba8; --line:#2e3735;
    --accent:#5fb3a8; --accent-ink:#0a1413; --accent-soft:#1c3431;
    --rec:#ef6a5e; --rec-soft:#3b201e; --warn:#e6b05a; --warn-soft:#382c16; --ok:#7bc38d; --ok-soft:#1b3222;
    --hl-done:#1f3d29; --hl-done-ink:#a6e3b5; --hl-rec:#47331a; --hl-rec-ink:#f3c27c; --hl-must:#4d2420; --hl-must-ink:#ffb1a8;
    --shadow:none;
  }
}
:root[data-theme=dark]{
  --bg:#111514; --surface:#1a201f; --surface-2:#222928; --ink:#e7ecea; --ink-2:#a1aba8; --line:#2e3735;
  --accent:#5fb3a8; --accent-ink:#0a1413; --accent-soft:#1c3431;
  --rec:#ef6a5e; --rec-soft:#3b201e; --warn:#e6b05a; --warn-soft:#382c16; --ok:#7bc38d; --ok-soft:#1b3222;
  --hl-done:#1f3d29; --hl-done-ink:#a6e3b5; --hl-rec:#47331a; --hl-rec-ink:#f3c27c; --hl-must:#4d2420; --hl-must-ink:#ffb1a8;
  --shadow:none;
}
:root[data-theme=comfort]{
  --bg:#f0dcc0; --surface:#faecd8; --surface-2:#f3e1c6; --ink:#33271b; --ink-2:#735e45; --line:#e4cba8;
  --accent:#3e6b5f; --accent-ink:#fbf6ea; --accent-soft:#dde3cf;
  --rec:#b04a3c; --rec-soft:#f1d6c8; --warn:#8a5a1c; --warn-soft:#f2dfb8; --ok:#4c6b38; --ok-soft:#dfe5c6;
  --hl-done:#d8e6c4; --hl-done-ink:#3c5a26; --hl-rec:#f5d9a8; --hl-rec-ink:#714815; --hl-must:#f0c9bb; --hl-must-ink:#86321f;
  --shadow:0 1px 2px rgba(60,40,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px;padding-top:env(safe-area-inset-top)}
.top h1{font-size:20px;font-weight:700;flex:1}
.top .title{flex:1;min-width:0}
.top .title b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title span{font-size:13px;color:var(--ink-2)}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:12px}
.muted{color:var(--ink-2);font-size:14px}
.small{font-size:13px}
label.lbl{display:block;font-size:14px;color:var(--ink-2);margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:84px}
.ltr{direction:ltr;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.danger{color:var(--rec);border-color:var(--rec)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.banner{border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li .grow{flex:1;min-width:0}
.list li b{display:block}
/* session */
.top .wrap.sub{display:block;min-height:0;padding-top:0}
.recbar{display:flex;align-items:center;gap:12px;padding:6px 0 8px}
.recbar .chips{flex:none;flex-direction:column;gap:4px}
.recbar .chip{padding:3px 12px;font-size:13px}
.recbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--rec);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(192,53,42,.35)}
.recbtn svg{width:28px;height:28px}
.recbtn.on{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,53,42,.5)}70%{box-shadow:0 0 0 14px rgba(192,53,42,0)}100%{box-shadow:0 0 0 0 rgba(192,53,42,0)}}
.rec-meta{flex:1;min-width:0}
.rec-meta .timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;line-height:1.2}
.rec-meta .state{font-size:13px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.miss{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
a.chip{text-decoration:none;color:var(--accent);display:inline-block}
.status{font-size:13px;color:var(--ink-2);min-height:20px;padding-bottom:4px;overflow-wrap:anywhere}
.status.err{color:var(--rec)}
.kbt{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:12.5px}.kbt th,.kbt td{border-bottom:1px solid var(--line);padding:4px 3px;text-align:right}.kbt th{color:var(--ink-2);font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:4px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabbody{padding-bottom:110px}
.sec{margin:16px 0}
.sec > h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec > h3 .cnt{font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:1px 8px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;transition:background .6s}
.field.flash{background:var(--accent-soft)}
.field label{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.field textarea{width:100%;border:0;background:transparent;resize:none;outline:none;padding:4px 0 0;min-height:28px;line-height:1.5;overflow:hidden}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;font-weight:500}
.badge.ai{background:var(--accent-soft);color:var(--accent)}
.badge.man{background:var(--surface-2);color:var(--ink-2)}
.badge.chk{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--rec-soft);color:var(--rec)}
.spk{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:0 6px;margin-left:6px;background:var(--surface-2);color:var(--ink-2)}
.spk.s1{background:var(--accent-soft);color:var(--accent)}
.spk.s2{background:var(--warn-soft);color:var(--warn)}
.audio-part{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.audio-part:first-child{border-top:0}
.audio-part audio{width:100%;height:36px}
.fmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.fmeta button{border:0;background:none;padding:2px 0;font-size:13px;color:var(--accent)}
.quote{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 8px;margin-top:6px}
.seg{padding:8px 0;border-bottom:1px dashed var(--line)}
.seg .t{font-size:12px;color:var(--ink-2);margin-left:6px;font-variant-numeric:tabular-nums}
.seg.manual{background:var(--surface-2);border-radius:8px;padding:8px}
.seg-play{display:inline-grid;place-items:center;width:26px;height:26px;padding:0;margin-left:6px;vertical-align:middle;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.seg-play svg{width:11px;height:11px}
.seg-play:hover,.seg.playing .seg-play{color:var(--accent);border-color:var(--accent)}
.seg.playing{background:var(--accent-soft);border-radius:8px;padding-inline:8px}
.player{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));margin:auto;max-width:560px;z-index:16;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.player[hidden]{display:none}
body.has-player .toast{bottom:calc(140px + env(safe-area-inset-bottom))}
.player button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;min-width:40px;height:36px;padding:0 8px;font:inherit;font-size:13px;cursor:pointer}
.player button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.player .pl-t{flex:1;min-width:0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-mark{margin:14px 0 4px;font-size:13px;font-weight:700;color:var(--accent)}
.interim{color:var(--ink-2);font-style:italic;padding:8px 0}
.actions{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);z-index:15;padding-bottom:env(safe-area-inset-bottom)}
.actions .wrap{display:flex;gap:10px;padding-top:10px;padding-bottom:10px}
.actions .btn{flex:1}
.analysis{line-height:1.65}
.analysis h2,.analysis h3,.analysis h4{margin:18px 0 6px;font-size:17px}
.analysis ul{padding-inline-start:20px;margin:6px 0}
.analysis p{margin:6px 0}
/* status highlights in the analysis: done / recommended / must */
.hl{border-radius:5px;padding:1px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-done{background:var(--hl-done);color:var(--hl-done-ink)}
.hl-rec{background:var(--hl-rec);color:var(--hl-rec-ink)}
.hl-must{background:var(--hl-must);color:var(--hl-must-ink);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:13px}
/* segmented theme picker */
.seg-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg-pick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-size:14px}
.seg-pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* form fields flow into columns when there is room */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));column-gap:12px;align-items:start}
.side-h{font-size:15px;margin:0;padding:12px 0 6px;display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--line)}
/* tablet */
@media (min-width:760px){
  .wrap{max-width:1060px;padding:0 24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
  .cols2{columns:2;column-gap:18px;padding-top:16px}
  .cols2 > .card{display:inline-block;width:100%;margin:0 0 18px}
  .recbar .chips{flex-direction:row}
  .recbar .chip{padding:6px 16px;font-size:14px}
  .toast{bottom:96px}
}
/* wide tablet / landscape: transcript stays visible beside the form */
.split{display:block}
@media (min-width:1000px){
  .wrap{max-width:1440px}
  .split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:28px;align-items:start}
  .side{position:sticky;top:calc(var(--hdr,170px) + 6px);max-height:calc(100dvh - var(--hdr,170px) - 92px);overflow:auto;
        border-inline-start:1px solid var(--line);padding:0 18px 16px 4px;overscroll-behavior:contain}
  .tabs{max-width:520px}
  .tabs [data-tab=transcript]{display:none}
}
.toast{position:fixed;left:16px;right:16px;bottom:90px;margin:auto;max-width:520px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;z-index:50;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--rec);color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
details.help{margin-top:8px}
details.help summary{color:var(--accent);font-size:14px;cursor:pointer}
.hr{height:1px;background:var(--line);margin:16px 0}
</style>
</head>

<script>

const $ = (s, el = document) => el.querySelector(s);

const pad = n => String(n).padStart(2, '0');

  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },

const DEFAULT_SETTINGS = {

const PRICE = { // $ per MTok: [input, output, cache-read multiplier]

function apiErrText(status, msg) {

async function callClaude(body, { onText, signal } = {}) {

  const stream = !!onText;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', signal,
    headers: {
      'content-type': 'application/json', 'x-api-key': settings.apiKey,
      'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ ...body, stream })
  });
  if (!resp.ok) {
    let msg = resp.statusText;
    try { const j = await resp.json(); msg = j.error?.message || msg; } catch { }
    const err = new Error(apiErrText(resp.status, msg)); err.status = resp.status; err.raw = msg; throw err;
  }
  if (!stream) { const j = await resp.json(); trackUsage(body.model, j.usage); return j; }

  let buf = '', text = '', u = {}, stop = null;

    const { done, value } = await reader.read();

      const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
      if (!data) continue;
      let ev; try { ev = JSON.parse(data); } catch { continue; }
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onText(text); }

      else if (ev.type === 'error') throw new Error(ev.error?.message || 'שגיאה בזרם התשובה');
    }
  }
  const cost = trackUsage(body.model, u);
  return { text, stop_reason: stop, usage: u, cost };

1. Record only what is actually in the transcript. Every test name, number, side and finding you write must be traceable to specific words in it. Never fill a field from general knowledge, never infer a diagnosis, never add a test that was not named.
2. Recognition errors: map a garbled term to a clinical term only when the sounds clearly match (see the list below), and then set "uncertain": true. If you cannot tell, write what was heard in quotes followed by "?" — e.g. "פולקן" (Full Can?). Never replace a heard term with a different test.
3. Do not reconstruct words or numbers that recognition dropped. E.g. "מתוך 5 בצד ימין" without the first number → "?/5 ימין" with "uncertain": true — never guess the missing number.

5. Write values in short, telegraphic clinical Hebrew. Keep standard English terms (VAS, AROM, MMT, Lachman, ULTT). Numbers as digits. State the side (ימין / שמאל / דו-צדדי) only when it was said.

7. special_tests: one line per test that was actually named — "שם המבדק — צד — חיובי/שלילי — הערה". A test that was not named never appears.
8. red_flags: one line per screening question actually asked, with the answer. A general statement such as "אין דגלים אדומים" is recorded as said, without inventing which questions were asked.
9. Fields marked LOCKED were edited by the therapist — never return updates for them.
10. "quote": copy the supporting words exactly as they appear in the NEW TRANSCRIPT, up to 15 words — no paraphrase and no correction of recognition errors. "uncertain": true when the recognition is garbled, a term was mapped through the list below, or it is unclear who said it.

const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly';

    if (!window.google?.accounts?.oauth2) return reject(new Error('ספריית ההתחברות של Google לא נטענה — בדוק אינטרנט ורענן'));

    const client = google.accounts.oauth2.initTokenClient({
      client_id: settings.clientId, scope: SCOPES,
      callback: r => {

        gToken = r.access_token; gExp = Date.now() + (r.expires_in || 3600) * 1000;

function htmlToText(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  const txt = n => n.textContent.replace(/\s+/g, ' ').trim();
  const list = (el, depth) => {
    for (const li of el.children) {
      if (li.tagName !== 'LI') continue;
      const c = li.cloneNode(true); c.querySelectorAll('ul,ol').forEach(x => x.remove());
      const t = txt(c); if (t) out.push('  '.repeat(depth) + '- ' + t);
      li.querySelectorAll(':scope > ul, :scope > ol').forEach(x => list(x, depth + 1));
    }
  };
  for (const el of doc.body.children) {
    const tag = el.tagName;
    if (/^H[1-6]$/.test(tag)) { const t = txt(el); if (t) out.push('', '#'.repeat(+tag[1]) + ' ' + t); }
    else if (tag === 'UL' || tag === 'OL') list(el, 0);
    else if (tag === 'TABLE') {
      for (const tr of el.querySelectorAll('tr')) {
        if (tr.closest('table') !== el) continue;
        const cells = [...tr.children].map(txt);
        if (cells.some(Boolean)) out.push('| ' + cells.join(' | ') + ' |');
      }
      out.push('');
    } else { const t = txt(el); if (t) out.push(t, ''); }

  return out.join('\n');
}
async function pdfToText(buf) {
  const pdfjs = await pdfLib();

  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    let line = '', prev = null;
    for (const it of tc.items) {
      if (prev && it.str && line && !/\s$/.test(line) && !/^\s/.test(it.str)) {
        const x1 = prev.transform[4], w1 = prev.width, x2 = it.transform[4], w2 = it.width;
        const gap = Math.min(Math.abs(x2 - (x1 + w1)), Math.abs(x1 - (x2 + w2)));
        if (Math.abs(prev.transform[5] - it.transform[5]) > 2 || gap > 0.8) line += ' ';
      }
      line += it.str;
      if (it.str) prev = it;
      if (it.hasEOL) { out += line.trimEnd() + '\n'; line = ''; prev = null; }
    }
    out += line + '\n\n';

}

async function fetchDoc(id, refresh = false) {

  if (c && !refresh && c.ver === KB_PARSER && Date.now() - c.checked < 12 * 36e5) return c;
  let meta;
  try { meta = await (await gfetch(`${DAPI}/${id}?fields=name,mimeType,modifiedTime`)).json(); }
  catch (e) {
    if (c && e.status !== 404) return { ...c, stale: true };
    throw new Error(e.status === 404 ? `קובץ לא נמצא או אין גישה (${id.slice(0, 8)}…)` : e.message);
  }
  if (c && !refresh && c.ver === KB_PARSER && c.modified === meta.modifiedTime) { const v = { ...c, checked: Date.now() }; await kbPut('doc:' + id, v); return v; }
  let text;
  try { text = cleanText(await driveDocText(id, meta)); }
  catch (e) { throw new Error(`"${meta.name}": ${e.message}`); }
  if (!text) throw new Error(`"${meta.name}": לא נמצא בו טקסט`);
  const v = { title: meta.name.replace(/\.(docx|pdf|txt|md)$/i, '').trim(), text, modified: meta.modifiedTime, checked: Date.now(), ver: KB_PARSER };

}
// keep only named parts of a document, e.g. "חלק ה": from that heading to the next heading of the same kind
const headNorm = s => s.replace(BIDI, '').replace(/^[\s#*>|_•·\-–—]+/, '').replace(/[׳'״"*]/g, '').replace(/\s+/g, ' ').trim();
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function pickParts(text, parts) {
  const lines = text.split('\n'), heads = lines.map(headNorm);
  const found = [], missing = [];
  for (const p of parts) {
    const key = headNorm(p), fam = key.split(' ')[0];
    const keyRe = new RegExp('^' + reEsc(key) + '(?=$|[\\s—–\\-:.)])');
    const famRe = new RegExp('^' + reEsc(fam) + ' (?:[א-ת]|\\d{1,2}|[IVX]{1,4})(?=$|[\\s—–\\-:.)])');
    let best = '';
    for (let i = 0; i < lines.length; i++) {
      if (heads[i].length > 140 || !keyRe.test(heads[i])) continue;
      let j = i + 1;
      while (j < lines.length && !(heads[j].length <= 140 && famRe.test(heads[j]))) j++;
      const seg = lines.slice(i, j).join('\n');
      if (seg.length > best.length) best = seg;
    }
    if (best) found.push(best.trim()); else missing.push(p);

  return { text: found.join('\n\n'), missing };
}

async function loadKB(region, refresh = false, onStep = () => { }) {
  const docs = [], problems = [];
  if (settings.siteKB) {
    onStep('מפת הדרך מהאתר');
    try {
      const st = await loadSite(refresh);
      docs.push({ title: 'מפת דרך — שיקום שמרני', text: SiteKB.regionText(st.data, region) });
      if (st.stale) problems.push('מפת הדרך לא נטענה עכשיו — נעשה שימוש בעותק שמור');
    } catch (e) { problems.push(e.message); }
  }
  const entries = parseKbDocs();
  entries.filter(d => d.bad).forEach(d => problems.push('שורה לא מזוהה: ' + d.bad.slice(0, 40)));
  const wanted = entries.filter(d => d.id && regionMatch(d.regions, region))
    .map((d, i) => ({ ...d, i })).sort((a, b) => ((a.regions ? 0 : 1) - (b.regions ? 0 : 1)) || a.i - b.i);
  if (wanted.length && !settings.clientId) problems.push('Drive לא מחובר — הסיכומים לא נטענו');
  else for (const [k, d] of wanted.entries()) {
    try {
      onStep(`סיכומים מ-Drive ${k + 1}/${wanted.length}`);
      const c = await fetchDoc(d.id, refresh);
      let text = c.text, title = c.title;
      if (d.parts) {
        const r = pickParts(text, d.parts);
        if (r.missing.length) problems.push(`"${c.title}": לא נמצא ${r.missing.join(', ')}${r.text ? '' : ' — נטען המסמך כולו'}`);
        if (r.text) { text = r.text; title += ' — ' + d.parts.join(', '); }
      }
      if (c.stale) problems.push(`"${c.title}": Drive לא זמין — עותק שמור`);
      docs.push({ title, text });
    } catch (e) { problems.push(e.message); }
  }
  if (settings.extraKB.trim()) docs.push({ title: 'ידע נוסף (הגדרות)', text: settings.extraKB.trim() });
  const budget = Math.max(20, +settings.kbBudget || 350) * 1000, kept = [], skipped = [];
  let used = 0;
  for (const d of docs) {
    if (used >= budget) { skipped.push(d.title); continue; }
    if (used + d.text.length > budget) { d.text = d.text.slice(0, budget - used) + '\n[…קוצר — תקרת בסיס הידע…]'; problems.push(`"${d.title}" קוצר`); }
    used += d.text.length; kept.push(d);
  }

}

const ANALYSIS_SYSTEM = `You are a clinical-reasoning assistant for a sports therapist (ספורט-תרפיסט) in Israel. You receive (1) the therapist's own knowledge base, (2) the session form, (3) the raw speech-recognition transcript (recognition errors; lines may carry [דובר N] speaker labels).

The knowledge base has up to three kinds of documents:
- "מפת דרך — שיקום שמרני": the therapist's verified decision map (his own site, built from open verified sources). A general 8-stage framework and principles for every region; for neck, shoulder, elbow and wrist/hand also the region chapter — red-flag screening, classification paths, test order with LR values, treatment, prognosis, and test cards.
- Lesson summaries from the therapist's courses, chosen for this region, plus general lessons (clinical reasoning, bone, muscle).
- Parts of the therapist's clinical tests compendium (מאגר מבדקים).

Write a working analysis in Hebrew that helps the therapist decide what to do next. It is a draft for the therapist's judgement: "הבחנה, לא אבחנה".

Rules:
- Ground the reasoning in the knowledge base first: its stages, red-flag rules, test order, clusters and LR values where they apply. Name the source you used, e.g. "(מפת דרך — כתף, SAPS)" or "(סיכום שיעור 8)".
- Where the decision map covers the region, follow its order of stages. If two sources disagree, prefer the decision map and point out the disagreement in one line.
- If the knowledge base does not cover this region or question, say so once and mark statements from general knowledge with "(ידע כללי)".
- Use only findings that appear in the form or transcript. Never invent results. If the form and transcript disagree, say so.
- Concise and telegraphic. Keep standard English clinical terms.
- If anything suggests stopping and referring, put it in the first line in bold.

Colour-code the status of tests, questions and screening items with these inline markers (the app renders them as coloured highlights):
- [[done: …]] green — already done in this session, with its result. Example: [[done: Hawkins-Kennedy ימין — חיובי]]
- [[rec: …]] orange — recommended to test or ask next. Example: [[rec: Painful arc]]
- [[must: …]] red — must test, ask or rule out before going on or treating: red flags, serious differentials, safety. Example: [[must: לשלול כאב לילה לא מכני]]
Wrap a short phrase (the item and a few words), never a whole paragraph, and never nest markers. Use them mostly in דגלים, מבדקים and מידע חסר; in other sections only where the status matters.

## סיכום קליני
3–5 lines.
## דגלים
Red flags: what was asked, what came up, what was NOT asked and still needs asking. Yellow flags.
## השערות עבודה
Leading hypothesis + 1–2 alternatives. For each: בעד / נגד / מה יכריע.
## מבדקים
What was done and how to read it (cluster, LR). What to test next, in order from gentle to provocative. What not to do yet (irritability, acute stage).

## כיוון טיפולי ומטרות

## מתי להפנות
Case-specific referral criteria.`;

const HL = { done: ['#d4f0db', '#1d5a2f'], rec: ['#ffe2b8', '#7a4300'], must: ['#ffd3cc', '#8e1f15'] };
const HL_LABEL = { done: 'נבדק', rec: 'מומלץ לבדוק', must: 'חובה לבדוק / לשלול' };
function hlSpan(kind, text, forDoc) {
  return forDoc ? `<span style="background-color:${HL[kind][0]};color:${HL[kind][1]}">${text}</span>` : `<mark class="hl hl-${kind}">${text}</mark>`;

function md(src, forDoc = false) {
  const lines = esc(src).split('\n');
  let html = '', list = false;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[\[(done|rec|must):\s*(.+?)\]\]/g, (m, k, x) => hlSpan(k, x, forDoc))
    .replace(/\[\[(done|rec|must):\s*([^\]]*)\]?$/, (m, k, x) => hlSpan(k, x, forDoc)); // unclosed at line end (while streaming)
  const close = () => { if (list) { html += '</ul>'; list = false; } };
  for (const l of lines) {
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    const li = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (h) { close(); const lv = Math.min(h[1].length + 1, 4); html += `<h${lv}>${inline(h[2])}</h${lv}>`; }
    else if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(li[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); html += `<p>${inline(l)}</p>`; }
  }
  close();
  return html;
}

const MAP_TAB = { 'צוואר וראש': 'neck', 'כתף': 'shoulder', 'מרפק': 'elbow', 'שורש כף יד וכף יד': 'hand' };
function mapLink(region, testId) { return MAP_URL + '#' + (MAP_TAB[region] || 'general') + (testId ? '&t=' + testId : ''); }
function testAliases(name) {
  const out = new Set();
  for (let part of String(name).replace(/[–—]/g, '—').split(/—|&| \/ /)) {
    part = part.replace(/\(.*?\)/g, '').replace(/\b(Test|Sign|Score)\b/gi, '').replace(/['’]s\b/g, '').replace(/\s+/g, ' ').trim();
    if (/[A-Za-z]/.test(part) && part.replace(/[^A-Za-z]/g, '').length >= 3) out.add(part);
    const acr = part.match(/^([A-Z]{3,5})(?![A-Za-z])/); if (acr) out.add(acr[1]); // e.g. ULTT 1-3 is also just ULTT
  }
  return [...out];
}

async function renderTestLinks() {
  const box = $('#testLinks'); if (!box || !session?.analysis || !settings.siteKB || !MAP_URL) { if (box) box.innerHTML = ''; return; }
  let st; try { st = await loadSite(); } catch { return; }
  const T = st.data.T || {}, text = session.analysis.replace(/[–—‐-]/g, '-');
  const inRegion = new Set(); const r = st.data.REGIONS.find(x => x.id === MAP_TAB[session.region]);
  if (r) JSON.stringify(r, (k, v) => { if (k === 'tests' && Array.isArray(v)) v.forEach(t => inRegion.add(t)); return v; });
  const homeOf = id => { if (inRegion.has(id)) return session.region; for (const reg of st.data.REGIONS) if (JSON.stringify(reg).includes('"' + id + '"')) return Object.keys(MAP_TAB).find(k => MAP_TAB[k] === reg.id); return null; };
  const found = [];
  for (const [id, t] of Object.entries(T)) {
    const hit = testAliases(t.n).some(a => new RegExp('(^|[^A-Za-z])' + a.replace(/[–—‐-]/g, '-').replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/-/g, '[-\\s]?') + '(?![A-Za-z])', 'i').test(text));
    if (hit) found.push([id, t.n]);
  }
  box.innerHTML = found.length ? `<div class="card" style="padding:12px"><div class="muted small" style="margin-bottom:8px">מבדקים שהוזכרו — פתיחת הכרטיס במפה:</div>

}

      <label class="lbl" for="sKb">סיכומים ב-Drive — קישור בכל שורה (Google Docs, ‏docx, ‏PDF). <span class="ltr">קישור | אזורים | חלקים</span>. בלי אזורים — לכל ניתוח. שורה שמתחילה ב-# היא הערה.</label>
      <textarea id="sKb" class="inp ltr" style="min-height:160px;font-size:12px">${esc(st.kbDocs)}</textarea>
      <button class="btn block" style="margin-top:8px" data-act="kbDefault">החזר לרשימה המוכנה</button>
      <label class="lbl" for="sBudget">תקרת בסיס ידע לניתוח אחד (אלפי תווים)</label>
      <input id="sBudget" class="inp" type="number" min="20" step="10" value="${esc(st.kbBudget)}">
      <label class="lbl" for="sExtra">ידע נוסף (טקסט חופשי, אופציונלי)</label>
      <textarea id="sExtra" class="inp">${esc(st.extraKB)}</textarea>
      <button class="btn block" style="margin-top:12px" data-act="refreshKb">רענן ובדוק את בסיס הידע</button>
      <div class="status" id="kbStatus"></div>
    </div>
    <div class="card"><h2>הקלטה ומילוי</h2>
      <label class="check"><input type="checkbox" id="sAuto" ${st.autoFill ? 'checked' : ''}><span>מילוי אוטומטי תוך כדי הקלטה</span></label>
      <label class="lbl" for="sChars">למלא אחרי כמה תווים חדשים</label>
      <input id="sChars" class="inp" type="number" min="80" step="20" value="${esc(st.fillChars)}">
      <label class="lbl" for="sEngine">מנוע תמלול</label>
      <select id="sEngine" class="inp">
        <option value="browser" ${st.engine !== 'soniox' ? 'selected' : ''}>זיהוי הדיבור של הדפדפן — חינם</option>
        <option value="soniox" ${st.engine === 'soniox' ? 'selected' : ''}>Soniox — רציף, מדויק יותר, מזהה דוברים (≈$0.12 לשעה)</option>
      </select>
      <div id="sonioxBox" ${st.engine === 'soniox' ? '' : 'hidden'}>
        <label class="lbl" for="sAccess">קוד גישה לתמלול (מוגדר בשרת ב-Cloudflare)</label>
        <input id="sAccess" class="inp ltr" type="password" autocomplete="off" value="${esc(st.accessCode)}">
        <p class="muted small">Soniox עובד רק מהכתובת של האתר ב-Cloudflare: מפתח החשבון נשמר שם בשרת, והמכשיר מקבל מפתח זמני לכל חיבור.</p>
      </div>
      <label class="check"><input type="checkbox" id="sAudio" ${st.saveAudio ? 'checked' : ''}><span>שמור את ההקלטה (אודיו) — במכשיר עד סגירת המפגש, וב-Drive יחד עם המפגש</span></label>
      <label class="check"><input type="checkbox" id="sCont" ${st.continuous ? 'checked' : ''}><span>זיהוי רציף בדפדפן (בטל אם מופיעות כפילויות בתמלול)</span></label>
    </div>
    <div class="card"><h2>נתונים</h2>
      <p class="muted small">עלות API מצטברת (הערכה): $${(usage.total || 0).toFixed(2)}</p>
      <button class="btn block danger" data-act="wipe">מחק את כל הנתונים המקומיים</button>
      <p class="muted small">מוחק מפתחות, רשימת מטופלים ומפגש פתוח מהטלפון. קבצים ב-Drive לא נמחקים.</p>
    </div>
  </main>`;
  const bind = (id, key, fn = v => v) => { const el = $('#' + id); el.addEventListener('change', () => { settings[key] = fn(el.type === 'checkbox' ? el.checked : el.value); saveSettings(); }); };
  bind('sKey', 'apiKey', v => v.trim()); bind('sExt', 'extractModel'); bind('sAna', 'analysisModel');
  bind('sCid', 'clientId', v => v.trim()); bind('sRoot', 'rootFolderName', v => v.trim() || 'מטופלים');
  bind('sKb', 'kbDocs'); bind('sExtra', 'extraKB'); bind('sSite', 'siteKB'); bind('sBudget', 'kbBudget', v => Math.max(20, +v || 350)); bind('sAuto', 'autoFill'); bind('sChars', 'fillChars', v => Math.max(80, +v || 600)); bind('sCont', 'continuous'); bind('sAccess', 'accessCode', v => v.trim()); bind('sAudio', 'saveAudio');
  bind('sEngine', 'engine'); $('#sEngine').addEventListener('change', e => { $('#sonioxBox').hidden = e.target.value !== 'soniox'; });
}

/* ---------------- events ---------------- */
let prevView = 'home';
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (t.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'settings': prevView = view === 'settings' ? prevView : view; go('settings'); break;
    case 'back': go(session && prevView === 'session' ? 'session' : 'home'); break;
    case 'home': go('home'); break;
    case 'resume': go('session'); break;
    case 'discard':
      if (session && !session.savedAt && !confirm('המפגש לא נשמר ב-Drive. לסגור בכל זאת? הנתונים יימחקו מהטלפון.')) return;
      if (recording) stopRec();
      stopPlayer();
      if (session) audioDelete(session.id);
      session = null; saveSession(true); render(); break;
    case 'pick': $('#pName').value = t.dataset.name; if (t.dataset.region) $('#pRegion').value = t.dataset.region; $('#pType').value = 'מפגש מעקב'; $('#pName').scrollIntoView({ block: 'center' }); break;
    case 'start': startSession(); break;
    case 'rec': recording ? stopRec() : startRec(); break;
    case 'stage':
      session.stage = t.dataset.stage; saveSession();
      $$('#stageChips .chip').forEach(c => c.classList.toggle('on', c.dataset.stage === session.stage));
      renderRecState(); refreshMissing(); break;
    case 'tab': tab = t.dataset.tab; renderTab(); break;
    case 'jump': { const el = $('#f-' + t.dataset.fid); if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); $('#t-' + t.dataset.fid)?.focus({ preventScroll: true }); } break; }
    case 'quote': { const q = $('#q-' + t.dataset.fid); if (q) q.hidden = !q.hidden; break; }
    case 'confirm': { const f = session.fields[t.dataset.fid]; if (f) { f.needsCheck = false; f.unverified = false; saveSession(); refreshField(t.dataset.fid); } break; }
    case 'unlock': { const f = session.fields[t.dataset.fid]; if (f) { f.locked = false; saveSession(); refreshField(t.dataset.fid); } break; }
    case 'fillNow':
      if (!settings.apiKey) { toast('חסר מפתח Claude API — הוסף בהגדרות', true); return; }
      if (filling) { toast('מילוי כבר רץ'); return; }
      maybeFill(true); break;
    case 'addManual': { const ta = $('#manualText'); if (ta.value.trim()) { addSegment(ta.value, true); ta.value = ''; } break; }
    case 'segPlay': playSeg(+t.dataset.i); break;
    case 'plToggle':
      if (!PL.audio) break;
      if (PL.audio.paused) { if (recording) { toast('ההשמעה זמינה כשההקלטה עצורה', true); break; } PL.audio.play().catch(() => { }); }
      else PL.audio.pause();
      break;
    case 'plSeek': if (PL.audio) { PL.audio.currentTime = Math.max(0, PL.audio.currentTime + +t.dataset.d); renderPlayerTime(); } break;
    case 'plClose': stopPlayer(); break;
    case 'analyze': runAnalysis(); break;
    case 'download': downloadCopy(); break;
    case 'copyLog': {
      const dump = JSON.stringify({ ua: navigator.userAgent, engine: settings.engine, continuous: settings.continuous, lang: settings.lang, saveAudio: settings.saveAudio, events: rawLog }, null, 1);
      try { await navigator.clipboard.writeText(dump); toast(`הלוג הועתק (${rawLog.length} אירועים) — הדבק אותו בצ'אט`); }
      catch {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([dump], { type: 'application/json' }));
        a.download = 'speech-log.json'; a.click(); toast('הלוג ירד כקובץ speech-log.json');
      }
      break;
    }
    case 'save':
      if (!settings.clientId) { toast('חסר Google Client ID בהגדרות', true); return; }
      saveToDrive(); break;
    case 'testKey': testKey(t); break;
    case 'testDrive': testDrive(t); break;
    case 'refreshKb': refreshKb(t); break;
    case 'theme': setTheme(t.dataset.theme); break;
    case 'cycleTheme': {
      const ids = THEMES.map(x => x[0]), next = ids[(ids.indexOf(getTheme()) + 1) % ids.length];
      setTheme(next); toast('תצוגה: ' + THEMES.find(x => x[0] === next)[1], false, 1400); break;
    }
    case 'kbDefault':
      if (settings.kbDocs.trim() !== KB_DEFAULT && !confirm('להחליף את הרשימה הנוכחית ברשימה המוכנה?')) return;
      settings.kbDocs = KB_DEFAULT; saveSettings(); $('#sKb').value = KB_DEFAULT; toast('הרשימה המוכנה הוחזרה'); break;
    case 'wipe':
      if (!confirm('למחוק את כל הנתונים המקומיים?')) return;
      Object.values(K).forEach(LS.del); try { sessionStorage.clear(); } catch { }
      try { await caches.delete(KB_CACHE); } catch { }
      try { indexedDB.deleteDatabase(AUDIO_DB); } catch { }
      location.reload(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('#tabBody textarea[data-fid]')) {
    autosize(t);
    const id = t.dataset.fid, val = t.value;
    session.fields[id] = { ...(session.fields[id] || {}), value: val, source: 'manual', locked: true, needsCheck: false, at: Date.now() };
    if (!val.trim()) session.fields[id] = { value: '', locked: false };
    saveSession(); refreshCounts();
  }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.matches('#tabBody textarea[data-fid]')) { const id = t.dataset.fid; setTimeout(() => { refreshField(id); refreshMissing(); }, 180); }
});

function startSession() {
  const name = $('#pName').value.trim();
  if (!name) { toast('הכנס שם מטופל', true); $('#pName').focus(); return; }
  if (!$('#pConsent').checked) { toast('יש לאשר שהמטופל הסכים להקלטה', true); return; }
  if (session && !session.savedAt && !confirm('יש מפגש פתוח שלא נשמר ב-Drive. להחליף אותו במפגש חדש?')) return;
  const p = patients.find(x => x.name === name);
  session = {
    id: Date.now().toString(36), patientName: name, region: $('#pRegion').value, type: $('#pType').value,
    consent: true, startedAt: new Date().toISOString(), stage: 'anamnesis', segments: [], processed: 0,
    fields: { name: { value: name, source: 'manual', locked: true } }, analysis: '', cost: 0,
    folderId: p?.folderId || null
  };
  upsertPatient({ name, region: session.region, last: session.startedAt });
  saveSession(true); tab = 'form'; lastStatus = { html: '', err: false, raw: false };
  loadTestNames();
  go('session');
}
async function testKey(btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> בודק…';
  try {
    const r = await callWithFallback({ model: 'claude-haiku-5-5', max_tokens: 20, messages: [{ role: 'user', content: 'ענה במילה אחת: תקין' }], thinking: { type: 'disabled' } });
    toast('המפתח תקין ✓ ' + ((r.content || []).find(b => b.type === 'text')?.text || ''));
  } catch (e) { toast(e.message, true, 6000); }
  finally { btn.disabled = false; btn.textContent = 'בדוק מפתח'; }
}
async function testDrive(btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> מתחבר…';
  try {
    await getToken();
    const id = await ensureRoot();
    toast('מחובר ✓ תיקיית "' + settings.rootFolderName + '" מוכנה ב-Drive');
    return id;
  } catch (e) { toast(e.message, true, 7000); }
  finally { btn.disabled = false; btn.textContent = 'התחבר ובדוק'; }
}
// reads every source again, then shows what each region's analysis would receive and roughly what it costs
async function refreshKb(btn) {
  const st = $('#kbStatus'), lines = [];
  const show = (busy) => { st.innerHTML = lines.join('<br>') + (busy ? `<br><span class="spin"></span> ${esc(busy)}…` : ''); };
  const ok = s => `<span style="color:var(--ok)">✓</span> ${esc(s)}`, bad = s => `<span style="color:var(--rec)">✗ ${esc(s)}</span>`;
  if (btn) btn.disabled = true;
  try {
    if (settings.siteKB) {
      show('מפת הדרך מהאתר');
      try {
        const s = await loadSite(true);
        lines.push(ok(`מפת הדרך${s.stale ? ' (עותק שמור — האתר לא זמין)' : ''} · ${Object.keys(s.data.T || {}).length} מבדקים · ${s.data.REGIONS.map(r => r.name || r.id).join(', ')}`));
      } catch (e) { lines.push(bad(e.message)); }
    }
    const entries = parseKbDocs(), seen = new Map();
    entries.filter(d => d.bad).forEach(d => lines.push(bad('שורה לא מזוהה: ' + d.bad.slice(0, 50))));
    for (const d of entries.filter(d => d.id)) { if (!seen.has(d.id)) seen.set(d.id, []); seen.get(d.id).push(d); }
    if (seen.size && !settings.clientId) lines.push(bad('Drive לא מחובר — הוסף Client ID והתחבר כדי לקרוא את הסיכומים'));
    else {
      let n = 0;
      for (const [id, uses] of seen) {
        show(`קורא מ-Drive ${++n}/${seen.size}`);
        try {
          const c = await fetchDoc(id, true);
          const where = uses.map(u => (u.regions ? u.regions.join(', ') : 'כל האזורים') + (u.parts ? ` [${u.parts.join(', ')}]` : '')).join(' ; ');
          const miss = uses.filter(u => u.parts).flatMap(u => pickParts(c.text, u.parts).missing);
          lines.push(ok(`${c.title} — ${kChars(c.text.length)} תווים · ${where}`) + (miss.length ? ' ' + bad('לא נמצא: ' + [...new Set(miss)].join(', ')) : ''));
        } catch (e) { lines.push(bad(e.message)); }
      }
    }
    // per-region totals (from the cache just filled)
    const p = PRICE[settings.analysisModel] || [4, 20];
    const rows = [];
    for (const region of REGIONS) {
      show('מחשב היקף לכל אזור: ' + region);
      const kb = await loadKB(region);
      let tok = null;
      if (settings.apiKey && kb.docs.length) {
        try { tok = await countTokens({ model: settings.analysisModel, system: ANALYSIS_SYSTEM, messages: [{ role: 'user', content: kbBlock(kb.docs) }] }); } catch { }
      }
      rows.push(`<tr><td>${esc(region)}</td><td>${kb.docs.length}</td><td>${kChars(kb.chars)}</td><td>${tok ? Math.round(tok / 1000) + 'K' : '—'}</td><td>${tok ? '$' + (tok * p[0] / 1e6).toFixed(2) : '—'}</td></tr>`);
    }
    lines.push(`<table class="kbt"><tr><th>אזור</th><th>מסמכים</th><th>תווים</th><th>טוקנים</th><th>קלט ≈</th></tr>${rows.join('')}</table>` +
      `<span class="small muted">עלות הקלט בלבד, במודל ${esc(settings.analysisModel)}. התשובה עצמה (כולל חשיבה) מוסיפה בדרך כלל $0.05–0.30.</span>`);
    show();
  } catch (e) { lines.push(bad(e.message)); show(); }
  finally { if (btn) btn.disabled = false; }
}

/* ---------------- boot ---------------- */
LS.del(K.kb); // v1 kept document texts in localStorage; they now live in Cache Storage
applyTheme();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
