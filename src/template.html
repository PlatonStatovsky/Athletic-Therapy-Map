<title>שיקום שמרני מפת דרך</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Shell: one tinted L-frame (the sidebar on the right and the 48px top bar, no rule between them) holds a white
   sheet inset 8px from the window's left and bottom edges, 16px corners, a 1px edge and no shadow.
   Inside the sheet: the page (fluid, 32px gutters, a 1040px reading column) and the tests panel, split by one rule.
   Desktop arithmetic at 1440: 228 sidebar + 8 inset + sheet 1204 = 1440; sheet = page 819 + rule 1 + panel 384.
   Depth is one tone step and one hairline; cards (8px) live on the sheet, rows live in cards. Nothing nests deeper. */
:root{
  /* בהיר — the frame is one low-chroma step of the product's teal; the sheet stays white */
  --ground:#f1f5f5; --surface:#ffffff; --raised:#f4f7f7; --active:#e3eaea; --hover:#e9efef;
  --border:#e4e8e9; --rule:#eef1f1; --control:#cdd2d3;
  --text:#131416; --muted:#5d5f60; --faint:#6b6d6e;
  --accent:#1b6c80; --accent-ink:#145667; --accent-soft:#e9f3f5; --accent-line:#b7d4db; --on-accent:#ffffff;
  --pos:#1e7b4f; --pos-ink:#0f4d2e; --pos-bg:#dcfae5; --pos-strip:#effaf3;
  --neg:#c4242a; --neg-ink:#831c1e; --neg-bg:#ffedea; --neg-strip:#fff4f2;
  --warn:#92400e; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --neu-bg:#ebedee; --neu-ink:#353736;
  --pt:#2f70bb; --pt-ink:#1f4f8a; --pt-bg:#eaf1fa;
  --mark:#ffe8a3; --mark-ink:#131416; --flash:rgb(27 108 128 / .12); --scrim:rgb(12 16 18 / .38);
  --pop-shadow:0 10px 30px rgb(16 24 28 / .10), 0 1px 3px rgb(16 24 28 / .06);
  --f:"IBM Plex Sans Hebrew", "IBM Plex Sans", "Assistant", "Segoe UI", Arial, sans-serif;
  --side-w:228px; --bar-h:48px; --panel-w:clamp(360px, 27vw, 460px); --inset:8px;
  --fs:1; --lh:1.65; --sm:16px; --barh:0px;
  color-scheme:light;
}
/* נוח לעין — warm paper and a hint of orange, less blue light and glare; the sheet is cream, not white */
:root[data-theme="comfort"]{
  --ground:#efe3d0; --surface:#fbf4e8; --raised:#f5ecdd; --active:#e5d6bf; --hover:#eadcc8;
  --border:#e6d7c0; --rule:#eee4d4; --control:#cdb99c;
  --text:#2e251b; --muted:#6b5a46; --faint:#6b5a46;
  --accent:#22626f; --accent-ink:#1b505b; --accent-soft:#ece8da; --accent-line:#c3c6b6; --on-accent:#fbf4e8;
  --pos:#3c6b3a; --pos-ink:#2b4f29; --pos-bg:#e5e8cc; --pos-strip:#eff0dc;
  --neg:#a63a2c; --neg-ink:#7c2a1f; --neg-bg:#f7dccd; --neg-strip:#f9e7dc;
  --warn:#8a4e0c; --warn-bg:#f7e6c8; --warn-line:#e6c48f;
  --neu-bg:#ebdfcc; --neu-ink:#3e3326;
  --pt:#2f5f95; --pt-ink:#24497a; --pt-bg:#e7e4da;
  --mark:#f2c96b; --mark-ink:#2e251b; --flash:rgb(34 98 111 / .12); --scrim:rgb(40 26 12 / .38);
  --pop-shadow:0 10px 30px rgb(60 40 20 / .12), 0 1px 3px rgb(60 40 20 / .08);
  --lh:1.72;
  color-scheme:light;
}
/* כהה — one warm near-black ground, the sheet a single step lighter, no pure black or white */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-theme="comfort"]){
  --ground:#141312; --surface:#1b1a19; --raised:#232220; --active:#2b2927; --hover:#242220;
  --border:#2c2a28; --rule:#252321; --control:#47433f;
  --text:#e6e4e0; --muted:#aba69e; --faint:#96918a;
  --accent:#79bccc; --accent-ink:#a3d3de; --accent-soft:#1c2a2d; --accent-line:#33525a; --on-accent:#141312;
  --pos:#7cc99a; --pos-ink:#9fdbb5; --pos-bg:#18281e; --pos-strip:#172119;
  --neg:#ef8f86; --neg-ink:#f4aaa2; --neg-bg:#2e1c1a; --neg-strip:#261918;
  --warn:#e2ab66; --warn-bg:#2a2116; --warn-line:#5a4526;
  --neu-bg:#2b2927; --neu-ink:#e6e4e0;
  --pt:#8db5e8; --pt-ink:#b2cdf0; --pt-bg:#1d2532;
  --mark:#6b5410; --mark-ink:#fff3d3; --flash:rgb(121 188 204 / .14); --scrim:rgb(0 0 0 / .55);
  --pop-shadow:0 10px 30px rgb(0 0 0 / .45);
  --lh:1.7;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --ground:#141312; --surface:#1b1a19; --raised:#232220; --active:#2b2927; --hover:#242220;
  --border:#2c2a28; --rule:#252321; --control:#47433f;
  --text:#e6e4e0; --muted:#aba69e; --faint:#96918a;
  --accent:#79bccc; --accent-ink:#a3d3de; --accent-soft:#1c2a2d; --accent-line:#33525a; --on-accent:#141312;
  --pos:#7cc99a; --pos-ink:#9fdbb5; --pos-bg:#18281e; --pos-strip:#172119;
  --neg:#ef8f86; --neg-ink:#f4aaa2; --neg-bg:#2e1c1a; --neg-strip:#261918;
  --warn:#e2ab66; --warn-bg:#2a2116; --warn-line:#5a4526;
  --neu-bg:#2b2927; --neu-ink:#e6e4e0;
  --pt:#8db5e8; --pt-ink:#b2cdf0; --pt-bg:#1d2532;
  --mark:#6b5410; --mark-ink:#fff3d3; --flash:rgb(121 188 204 / .14); --scrim:rgb(0 0 0 / .55);
  --pop-shadow:0 10px 30px rgb(0 0 0 / .45);
  --lh:1.7;
  color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--text); font-family:var(--f); font-size:calc(15px * var(--fs)); line-height:var(--lh);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; transition:background-color .2s, color .2s}
bdi{unicode-bidi:isolate}
[hidden]{display:none !important}
a{color:var(--accent); text-underline-offset:3px}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
summary{cursor:pointer; list-style:none}
summary::-webkit-details-marker{display:none}

/* ---------- the frame ---------- */
.app{display:grid; grid-template-columns:var(--side-w) minmax(0, 1fr); grid-template-rows:var(--bar-h) minmax(0, 1fr); height:100vh; height:100dvh}
header.bar{grid-column:1 / -1; grid-row:1; display:grid; grid-template-columns:var(--side-w) minmax(0, 1fr) auto; align-items:center; column-gap:16px;
  height:var(--bar-h); padding-inline-end:max(16px, env(safe-area-inset-left, 0px)); position:relative; z-index:12}
.brand{display:flex; align-items:center; gap:10px; min-width:0; padding-inline-start:max(20px, env(safe-area-inset-right, 0px))}
.mark{width:22px; height:22px; flex:none; color:var(--accent)}
.wm{display:grid; line-height:1.2; min-width:0}
.wm b{font-weight:600; font-size:calc(15px * var(--fs)); letter-spacing:-.005em; justify-self:start}
.wm span{font-size:calc(12px * var(--fs)); color:var(--muted); white-space:nowrap}
.bar-title{display:none; font-weight:600; font-size:calc(15px * var(--fs)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.search{position:relative; justify-self:center; width:min(548px, 100%); min-width:0}
.field{display:flex; align-items:center; gap:8px; height:32px; padding:0 10px; background:var(--surface); border:1px solid var(--border); border-radius:6px}
.field:focus-within{border-color:var(--accent)}
.field svg{flex:none; width:16px; height:16px; stroke:var(--muted)}
.field input{flex:1; min-width:0; height:100%; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:calc(14px * var(--fs))}
.field input::placeholder{color:var(--faint)}
.field input::-webkit-search-cancel-button{display:none}
kbd{font:inherit; font-size:calc(12px * var(--fs)); line-height:18px; min-width:20px; text-align:center; border:1px solid var(--control); border-radius:4px; padding:0 5px; color:var(--muted)}
.tools{display:flex; align-items:center; gap:4px}
.ibtn{display:inline-grid; place-items:center; width:32px; height:32px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; flex:none}
.ibtn:hover, .ibtn[aria-expanded="true"]{background:var(--hover); color:var(--text)}
.ibtn svg, .tbtn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
.tbtn{display:none; align-items:center; gap:8px; height:32px; padding:0 12px; border:1px solid var(--control); border-radius:6px; background:var(--surface); font-size:calc(14px * var(--fs)); font-weight:500; cursor:pointer}
.tbtn:hover{background:var(--raised)}
.menu-btn, .search-btn, .qclose{display:none}
.dwrap{position:relative}
.pop{position:absolute; top:calc(100% + 8px); inset-inline-end:0; z-index:30; width:288px; display:grid; gap:8px; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--pop-shadow)}
.pop-l{font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:500}
.pop-l + .seg{margin-bottom:6px}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:2px; gap:2px; border-radius:8px; background:var(--raised)}
.seg button{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:30px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-size:calc(13px * var(--fs)); font-weight:500; cursor:pointer}
.seg button svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 0 0 1px var(--border)}
.seg button:not([aria-pressed="true"]):hover{color:var(--text)}

/* search results */
.results{position:absolute; top:calc(100% + 6px); inset-inline:0; min-width:min(560px, 92vw); max-height:min(72vh, 640px); overflow:auto; z-index:30;
  padding:6px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; box-shadow:var(--pop-shadow)}
.rgroup{padding:2px 0 6px}
.rgroup + .rgroup{border-top:1px solid var(--rule)}
.rgroup h6{margin:8px 10px 4px; font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:500}
.res{display:block; width:100%; text-align:start; background:none; border:0; border-radius:6px; padding:7px 10px; cursor:pointer}
.res[aria-selected="true"], .res:hover{background:var(--raised)}
.res .rt{font-weight:600; font-size:calc(14px * var(--fs))}
.res .rs{font-size:calc(12px * var(--fs)); color:var(--muted)}
.res .rx{display:block; margin-top:1px; font-size:calc(13px * var(--fs)); color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
mark{background:var(--mark); color:var(--mark-ink); border-radius:3px; padding:0 1px}
.rempty{padding:14px 12px; color:var(--muted); font-size:calc(14px * var(--fs))}

/* ---------- sidebar: the screens, and the current screen's own index under it ---------- */
nav.side{grid-column:1; grid-row:2; min-height:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column;
  padding:4px 12px 16px; padding-inline-start:max(12px, env(safe-area-inset-right, 0px))}
.regions{display:grid; gap:2px}
.rail-h{font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:500; margin:20px 10px 6px}
.rail-h:first-child{margin-top:8px}
.reg{display:flex; align-items:center; width:100%; min-height:34px; padding:6px 10px; border:0; border-radius:8px; background:transparent; color:var(--muted);
  font-size:calc(14px * var(--fs)); font-weight:500; line-height:1.35; text-align:start; cursor:pointer}
.reg .cnt{display:none}
.reg:hover{background:var(--hover); color:var(--text)}
.reg[aria-selected="true"]{background:var(--active); color:var(--text); font-weight:600}
.outline{display:grid; margin:2px 0 10px; padding-inline-start:8px}
.outline:empty{display:none}
.ol-st{display:grid; grid-template-columns:18px minmax(0, 1fr); gap:6px; align-items:baseline; padding:5px 8px; border:0; border-radius:6px; background:none;
  text-align:start; font-size:calc(13px * var(--fs)); line-height:1.4; color:var(--muted); cursor:pointer}
.ol-st .n{font-size:calc(12px * var(--fs)); color:var(--faint); text-align:center}
.ol-st.flag .n{color:var(--neg)}
.ol-st:hover{background:var(--hover); color:var(--text)}
.ol-st.on{color:var(--text); font-weight:500}
.ol-st.on .n{color:var(--accent); font-weight:600}
.ol-st.flag.on .n{color:var(--neg)}
details.legend{margin-top:auto; padding:16px 10px 0; font-size:calc(12px * var(--fs)); color:var(--muted)}
details.legend > summary{font-weight:500; display:flex; justify-content:space-between}
details.legend > summary::after{content:"+"}
details.legend[open] > summary::after{content:"−"}
.lg-b{display:grid; gap:6px; padding-top:10px}
.lg-b span{display:flex; align-items:center; gap:8px}
.sw{width:10px; height:10px; border-radius:3px; flex:none; background:var(--neu-bg)}
.sw.stop{background:var(--neg)} .sw.go{background:var(--pos)} .sw.test{background:var(--accent)} .sw.ev{background:var(--warn)}
.sw.pt{background:var(--pt)} .sw.th{background:var(--neu-ink)}
.legend .ab{pointer-events:none}
.side-brand{display:none}

/* ---------- the sheet ---------- */
.sheet{grid-column:2; grid-row:2; min-height:0; display:grid; grid-template-columns:minmax(0, 1fr) var(--panel-w);
  margin:0 0 var(--inset); margin-inline-end:var(--inset); background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden}
main{min-width:0; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:28px 32px 96px}
.main-in{max-width:1040px; margin-inline:auto; container-type:inline-size; container-name:main}
.panel{min-height:0; overflow-y:auto; overscroll-behavior:contain; border-inline-start:1px solid var(--border); background:var(--surface); container-type:inline-size; container-name:panel}

/* ---------- page head ---------- */
.region-head{display:grid; gap:6px; margin:0 0 28px}
.region-head h1, .region-head .ttl{margin:0; font-size:calc(22px * var(--fs)); font-weight:600; line-height:1.3; letter-spacing:-.005em; text-wrap:balance}
.lede{margin:0; max-width:74ch; color:var(--muted)}
.meta{display:flex; flex-wrap:wrap; font-size:calc(13px * var(--fs)); color:var(--muted)}
.meta span + span::before{content:"·"; margin-inline:8px; color:var(--faint)}

/* region map: the safety gate, then every pattern with its pathologies, one click from the path itself */
.rmap{display:grid; gap:12px; margin:0 0 44px}
.gate{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 12px; padding:10px 14px; border-radius:8px; background:var(--neg-strip); color:var(--text); font-size:calc(14px * var(--fs))}
.gate-k{display:inline-flex; align-items:center; gap:8px; font-weight:600; color:var(--neg-ink); white-space:nowrap}
.gate-k::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--neg); flex:none}
.gate-q{flex:1 1 300px; min-width:0}
.gate .golink{color:var(--neg-ink); white-space:nowrap}
.mp-t{border:1px solid var(--border); border-radius:8px}
.mp-r{display:grid; grid-template-columns:minmax(150px, 32%) minmax(0, 1fr); gap:6px 20px; padding:12px 16px; border-top:1px solid var(--rule)}
.mp-r:first-child{border-top:0}
.mp-h{font-size:calc(14px * var(--fs)); font-weight:600; line-height:1.45}
.mp-h .pn{color:var(--faint); font-weight:500; margin-inline-end:6px}
.mp-h small{display:block; margin-top:2px; font-size:calc(12px * var(--fs)); font-weight:400; color:var(--muted); line-height:1.5}
.mp-l{display:flex; flex-wrap:wrap; gap:6px; align-content:start}
.mp-i{display:inline-flex; align-items:center; gap:8px; min-height:30px; padding:3px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface);
  font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.35; text-align:start; cursor:pointer}
.mp-i:hover{border-color:var(--control); background:var(--raised)}
.mp-i .tc{font-size:calc(12px * var(--fs)); color:var(--faint); font-weight:400}

/* ---------- the spine: the decision path, one numbered node per station ---------- */
ol.spine{list-style:none; margin:0; padding:0; display:grid}
.st{display:grid; grid-template-columns:28px minmax(0, 1fr); column-gap:18px; position:relative; scroll-margin-top:var(--sm)}
.st::before{content:""; position:absolute; top:34px; bottom:6px; inset-inline-start:13.5px; width:1px; background:var(--border)}
.st:last-child::before{display:none}
.num{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; position:relative; z-index:1; background:var(--surface); border:1px solid var(--control);
  color:var(--muted); font-size:calc(13px * var(--fs)); font-weight:600; transition:background-color .15s, color .15s, border-color .15s}
.st.flag .num{border-color:var(--neg); color:var(--neg)}
.st.cur .num{background:var(--text); border-color:var(--text); color:var(--surface)}
.st.flag.cur .num{background:var(--neg); border-color:var(--neg); color:var(--surface)}
.card{min-width:0; padding:2px 0 52px}
.st:last-child .card{padding-bottom:8px}
.card h3{margin:0; font-size:calc(18px * var(--fs)); font-weight:600; line-height:1.4}
.card .sub{margin-top:2px; color:var(--muted); font-size:calc(13px * var(--fs))}
.card p{margin:10px 0 0; max-width:78ch}
.blocks{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap:22px 36px; margin-top:16px}
.blk{min-width:0}
.blk.wide{grid-column:1 / -1}
.blk h4{margin:0 0 6px; font-size:calc(15px * var(--fs)); font-weight:600; line-height:1.45}
.blk > p:first-of-type{margin-top:0}
.blk.key, .blk.stopblk{grid-column:1 / -1; padding:10px 14px; border-radius:8px}
.blk.key{background:var(--pos-strip)}
.blk.key h4{margin:0; color:var(--pos-ink)}
.blk.stopblk{background:var(--neg-strip)}
.blk.stopblk h4{color:var(--neg-ink)}
.blk.stopblk h4:only-child{margin:0}
.card > .blk{margin-top:16px}
ul.li{margin:0; padding-inline-start:18px; display:grid; gap:4px; list-style:disc}
ul.li li::marker{color:var(--faint)}

/* abbreviations */
abbr.ab{text-decoration:underline dotted; text-decoration-color:var(--faint); text-underline-offset:3px; cursor:help}
.tip{position:fixed; z-index:40; max-width:340px; padding:8px 11px; border-radius:6px; background:var(--text); color:var(--surface); font-size:calc(13px * var(--fs)); line-height:1.45; pointer-events:none; box-shadow:var(--pop-shadow)}
.tip b{font-weight:600}
.tip .en{display:block; opacity:.75; direction:ltr; text-align:right}

/* decision: one question, two outcomes */
.dec{margin-top:16px; border:1px solid var(--border); border-radius:8px}
.dec-q{display:flex; align-items:flex-start; gap:12px; padding:12px 14px; font-weight:500}
.dia{flex:none; width:16px; height:16px; margin-top:5px; transform:rotate(45deg); border:1.5px solid var(--text); border-radius:2px; display:grid; place-items:center}
.dia span{transform:rotate(-45deg); font-size:10px; font-weight:600; line-height:1}
.dec-out{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--border)}
.out{padding:10px 14px; font-size:calc(14px * var(--fs)); min-width:0}
.out + .out{border-inline-start:1px solid var(--border)}
.out b{display:inline-flex; align-items:center; height:22px; padding:0 9px; margin-inline-end:8px; border-radius:999px; font-size:calc(12px * var(--fs)); font-weight:600}
.out.bad b{background:var(--neg-bg); color:var(--neg-ink)}
.out.good b{background:var(--pos-bg); color:var(--pos-ink)}

/* red-flag screening: one card, one row per check */
.checks-label{margin:22px 0 8px; font-size:calc(13px * var(--fs)); font-weight:600; color:var(--muted)}
.checks{border:1px solid var(--border); border-radius:8px}
details.chk{border-top:1px solid var(--rule); scroll-margin-top:var(--sm)}
details.chk:first-child{border-top:0}
details.chk > summary{display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:46px; padding:10px 16px; font-size:calc(14px * var(--fs)); font-weight:500}
details.chk > summary:hover{background:var(--raised)}
details.chk > summary::after, details.q > summary::after, details.hist > summary::after, details.more > summary::after, details.evi > summary::after, details.about > summary::after{content:"+"; margin-inline-start:auto; color:var(--muted); font-weight:400; flex:none}
details.chk[open] > summary::after, details.q[open] > summary::after, details.hist[open] > summary::after, details.more[open] > summary::after, details.evi[open] > summary::after, details.about[open] > summary::after{content:"−"}
details.chk[open] > summary{font-weight:600}
.chk-body{padding:0 16px 14px; display:grid; gap:10px; font-size:calc(14px * var(--fs))}
.chain{display:grid}
.chain .row{display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:12px; align-items:baseline; padding:7px 0; border-top:1px solid var(--rule)}
.chain .row:first-child{border-top:0}
.chain .row .y{font-size:calc(12px * var(--fs)); font-weight:600; color:var(--neg-ink); white-space:nowrap}
.chain .nx{font-size:calc(12px * var(--fs)); color:var(--faint); padding-bottom:2px}
.dd{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.dd div{font-size:calc(14px * var(--fs))}
.dd h5{margin:0 0 4px; font-size:calc(13px * var(--fs)); font-weight:600}

/* test chips: the one interactive object, so the one accent */
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:3px 10px; border:1px solid var(--accent-line); border-radius:6px; background:var(--surface);
  color:var(--accent-ink); font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.35; text-align:start; cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chip .o{font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:400}
.chip.on .o{color:var(--on-accent)}
.chip .pv{width:8px; height:8px; fill:currentColor; opacity:.7; flex:none}
.chip.flat{cursor:default; border-style:dashed; border-color:var(--control); color:var(--muted); background:transparent}
.chips .arr{color:var(--faint); font-size:calc(13px * var(--fs))}
.cg{display:inline-flex; align-items:center; gap:6px; max-width:100%; min-width:0}
.cg .chip{min-width:0}

/* questionnaire and tables */
details.q{margin-top:16px; max-width:820px; border:1px solid var(--border); border-radius:8px}
details.q > summary{display:flex; align-items:center; gap:12px; min-height:44px; padding:10px 14px; font-size:calc(14px * var(--fs)); font-weight:500}
.q-body{padding:0 14px 12px; font-size:calc(14px * var(--fs)); display:grid; gap:8px}
.q-body p{margin:0}
table{border-collapse:collapse; width:100%; font-size:calc(14px * var(--fs))}
.tbl{overflow-x:auto; margin-top:4px}
th, td{padding:8px 10px; text-align:start; vertical-align:top; border-bottom:1px solid var(--rule)}
thead th{font-size:calc(12px * var(--fs)); font-weight:500; color:var(--muted); border-bottom-color:var(--border); vertical-align:bottom}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:500; white-space:nowrap}
.tbl th:first-child, .tbl td:first-child{padding-inline-start:0}
.tbl th:last-child, .tbl td:last-child{padding-inline-end:0}

/* patterns and paths: a card per pattern, a row per pathology, the path opens in its row */
.pat-tools{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
.ghost{height:32px; padding:0 12px; border:1px solid var(--control); border-radius:6px; background:var(--surface); font-size:calc(13px * var(--fs)); font-weight:500; cursor:pointer}
.ghost:hover{background:var(--raised)}
.pats{display:grid; gap:16px; margin-top:16px}
.pat{min-width:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; container-type:inline-size; scroll-margin-top:var(--sm)}
.pat-h{display:flex; align-items:baseline; gap:8px; padding:14px 16px 2px}
.pat-h .pn{color:var(--faint); font-size:calc(14px * var(--fs)); font-weight:500}
.pat-h h4{margin:0; font-size:calc(15px * var(--fs)); font-weight:600}
.pat .pic{margin:0; padding:0 16px 12px; font-size:calc(13px * var(--fs)); color:var(--muted)}
.path{border-top:1px solid var(--rule); scroll-margin-top:var(--sm)}
.path > button.ph{width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:46px; padding:9px 16px; border:0; background:none;
  font-size:calc(14px * var(--fs)); font-weight:500; text-align:start; cursor:pointer}
.path > button.ph:hover{background:var(--raised)}
.path.open > button.ph{font-weight:600; background:var(--raised)}
.ph .pm{display:flex; align-items:center; gap:14px; flex:none}
.ph .tc{font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:400}
.ph .tg{width:14px; text-align:center; color:var(--muted); font-weight:400}
.pbody{display:grid; gap:14px; padding:14px 16px 18px}
details.about{border-radius:6px; background:var(--raised)}
details.about > summary{display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:calc(13px * var(--fs)); font-weight:500}
details.about > summary .i{width:16px; height:16px; border-radius:50%; border:1px solid currentColor; display:grid; place-items:center; font-size:10px; font-weight:600; flex:none}
.about-b{padding:0 12px 10px; font-size:calc(14px * var(--fs)); display:grid; gap:6px}
.about-b p{margin:0; max-width:75ch}
.gen{font-size:calc(12px * var(--fs)); color:var(--muted)}
.flow{display:grid}
.fs{display:grid; grid-template-columns:12px minmax(0, 1fr); gap:12px; align-items:start; position:relative; padding-bottom:14px}
.fs:last-child{padding-bottom:0}
.fs:not(:last-child)::before{content:""; position:absolute; inset-inline-start:5.5px; top:18px; bottom:0; width:1px; background:var(--border)}
.dot{width:12px; height:12px; margin-top:6px; border-radius:50%; border:1.5px solid var(--control); background:var(--surface); position:relative; z-index:1}
.fs.r .dot{border-color:var(--neg)} .fs.g .dot{border-color:var(--pos)}
.fs h5{margin:0; font-size:calc(12px * var(--fs)); font-weight:600; color:var(--muted)}
.fs.r h5{color:var(--neg-ink)} .fs.g h5{color:var(--pos-ink)}
.fs p{margin:2px 0 0; font-size:calc(14px * var(--fs))}
.pn2{display:grid; grid-template-columns:1fr 1fr; margin-top:6px; border:1px solid var(--border); border-radius:6px}
.pn2 > div{min-width:0; padding:8px 12px; font-size:calc(14px * var(--fs))}
.pn2 > div + div{border-inline-start:1px solid var(--border)}
.pn2 b{display:block; margin-bottom:2px; font-size:calc(12px * var(--fs)); font-weight:600; color:var(--muted)}
.pn2 .pp b{color:var(--text)}
.pn2.one{grid-template-columns:1fr}
.pn2.one > div + div{border-inline-start:0; border-top:1px solid var(--border)}
.golink{padding:0; border:0; background:none; color:var(--accent); font-weight:500; text-decoration:underline; text-underline-offset:3px; cursor:pointer; text-align:start}
.flash{animation:flash 1.6s ease-out; border-radius:8px}
@keyframes flash{0%, 35%{background-color:var(--flash); box-shadow:0 0 0 4px var(--flash)} 100%{box-shadow:0 0 0 0 transparent}}

/* ---------- panel: the tests, and the selected test ---------- */
.ptabs{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px; height:48px; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--rule)}
.ptitle{margin-inline-end:auto; font-size:calc(14px * var(--fs)); font-weight:600}
.plegend{display:flex; gap:6px; align-items:center}
.role{display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:999px; font-size:calc(12px * var(--fs)); font-weight:600; line-height:1; white-space:nowrap}
.role.pt{background:var(--pt-bg); color:var(--pt-ink)}
.role.th{background:var(--neu-bg); color:var(--neu-ink)}
.who{font-weight:600} .who.pt{color:var(--pt-ink)}
.pclose{display:none}
.pbox{padding:16px 20px 48px; display:grid; gap:18px}
.pbox h3{margin:0; font-size:calc(18px * var(--fs)); font-weight:600; line-height:1.4}
.phint{margin:-8px 0 0; color:var(--muted); font-size:calc(13px * var(--fs))}
.tl-h{margin:6px 0 -12px; font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:500}
.tlist{display:grid}
.ti{display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:10px; align-items:center; margin:0 -8px; padding:7px 8px; border:0; border-radius:6px; background:none; text-align:start; cursor:pointer}
.ti:hover{background:var(--raised)}
.ti .tn{font-weight:500; font-size:calc(14px * var(--fs))}
.ti .te{display:block; font-size:calc(12px * var(--fs)); color:var(--muted); font-weight:400}
.ti .tv{display:inline-flex; align-items:center; gap:4px; font-size:calc(12px * var(--fs)); color:var(--muted); white-space:nowrap}
.ti .tv svg{width:8px; height:8px; fill:currentColor}
.back{justify-self:start; height:28px; padding:0 10px; border:1px solid var(--control); border-radius:6px; background:var(--surface); font-size:calc(13px * var(--fs)); font-weight:500; cursor:pointer}
.back:hover{background:var(--raised)}
.thead{display:grid; gap:6px}
.aim{margin:0; color:var(--muted); font-size:calc(14px * var(--fs))}
.ps h4{margin:0 0 8px; font-size:calc(12px * var(--fs)); font-weight:600; color:var(--muted)}
.rolecards{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--border); border-radius:8px}
.rc{min-width:0; padding:10px 12px; font-size:calc(14px * var(--fs)); line-height:1.55}
.rc + .rc{border-inline-start:1px solid var(--border)}
.rc p{margin:6px 0 0}
ol.steps{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:10px; counter-reset:st}
ol.steps li{display:grid; grid-template-columns:22px auto minmax(0, 1fr); gap:8px; align-items:start; font-size:calc(14px * var(--fs)); line-height:1.6; counter-increment:st}
ol.steps li::before{content:counter(st); width:22px; height:22px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--control); color:var(--muted); font-size:calc(12px * var(--fs)); font-weight:600}
ol.steps li.pt::before{border-color:var(--pt); color:var(--pt-ink)}
ol.steps li .role{margin-top:1px}
.h4row{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.evq{padding:0; border:0; background:none; color:var(--accent); font:inherit; font-size:calc(12px * var(--fs)); font-weight:500; text-decoration:underline; text-underline-offset:3px; cursor:pointer}
/* foundations: "what changed and why", source lines, pointers */
details.hist{margin-top:12px; border:1px solid var(--border); border-radius:8px}
details.hist > summary{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; padding:10px 14px}
.hs-l{display:inline-flex; align-items:center; gap:8px; font-size:calc(14px * var(--fs)); font-weight:600}
.hs-l::before{content:""; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--accent); flex:none; align-self:center}
.hs-t{font-size:calc(13px * var(--fs)); color:var(--muted)}
.hist-b{display:grid; gap:8px; padding:12px 14px 14px; border-top:1px solid var(--rule)}
.hist-b .hr{display:grid; grid-template-columns:112px minmax(0, 1fr); gap:12px; align-items:baseline; font-size:calc(14px * var(--fs))}
.hist-b .hl{font-size:calc(12px * var(--fs)); font-weight:600; color:var(--muted)}
.hist-b .hr.so .hl{color:var(--pos-ink)}
.hist-b .hr.dis .hl{color:var(--neg-ink)}
@container main (max-width:560px){ .hist-b .hr{grid-template-columns:1fr; gap:2px} }
p.bsrc{margin:8px 0 0; font-size:calc(12px * var(--fs)); color:var(--muted); line-height:1.6}
p.bsrc a{font-weight:500}
.blk.gob{padding:0}
/* evidence-reading guide — top of the tests panel, closed by default */
details.evg{border:1px solid var(--border); border-radius:8px; scroll-margin-top:60px}
details.evg > summary{display:flex; align-items:center; gap:12px; padding:10px 12px}
.evg-pm{flex:none; width:20px; height:20px; border-radius:50%; border:1px solid var(--control); position:relative}
.evg-pm::before, .evg-pm::after{content:""; position:absolute; inset:50% auto auto 50%; width:8px; height:1.5px; margin:-.75px 0 0 -4px; background:var(--muted); transition:transform .18s}
.evg-pm::after{transform:rotate(90deg)}
details.evg[open] > summary .evg-pm::after{transform:rotate(0deg)}
.evg-t{display:grid; gap:1px}
.evg-t b{font-size:calc(14px * var(--fs)); font-weight:600}
.evg-t span{font-size:calc(12px * var(--fs)); color:var(--muted)}
.evg-in{display:grid; gap:10px; padding:0 12px 12px; font-size:calc(14px * var(--fs))}
.evg-in p{margin:0}
details.evi{border-top:1px solid var(--rule)}
details.evi > summary{display:grid; grid-template-columns:1fr auto; gap:1px 10px; align-items:center; padding:9px 0}
details.evi > summary::after{grid-row:1 / span 2; grid-column:2}
.evi-n{font-size:calc(14px * var(--fs)); font-weight:600}
.evi-k{font-size:calc(12px * var(--fs)); color:var(--muted)}
details.evi > div{display:grid; gap:9px; padding:0 0 12px}
details.evi strong, .evg-intro strong{font-weight:600}
.gx{padding:8px 10px; border-radius:6px; background:var(--raised)}
.mn{display:grid}
.mn > div{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:baseline; padding:6px 0; border-top:1px solid var(--rule)}
.mn > div:first-child{border-top:0}
.mnk{font-weight:600; font-size:calc(14px * var(--fs))}
.evg-src{font-size:calc(12px * var(--fs)); color:var(--muted)}
table.cut{margin:8px 0 2px; border:1px solid var(--border); border-radius:6px; border-collapse:separate; border-spacing:0; overflow:hidden; background:var(--surface)}
table.cut th, table.cut td{padding:6px 10px; text-align:start; vertical-align:middle; border:0; border-top:1px solid var(--rule)}
table.cut thead th{border-top:0; background:var(--raised); color:var(--muted); font-size:calc(12px * var(--fs)); font-weight:500}
table.cut tbody th{font-weight:400}
table.cut td{font-weight:600; white-space:nowrap}
table.cut.wrap td{white-space:normal}
table.cut.tt td{text-align:center}
table.cut.tt tbody tr:first-child td:nth-of-type(1), table.cut.tt tbody tr:last-child td:nth-of-type(2){color:var(--pos-ink)}
table.cut.tt tbody tr:first-child td:nth-of-type(2), table.cut.tt tbody tr:last-child td:nth-of-type(1){color:var(--neg-ink)}
/* test illustration: 80% of the panel width, aspect kept; white paper blends into the theme surface */
.tfig{width:85%; width:min(100%, 80cqw); margin:8px auto; border-radius:8px; overflow:hidden; border:1px solid var(--border)}
.tfig img{display:block; width:100%; height:auto; mix-blend-mode:multiply}
:root[data-theme="dark"] .tfig{background:#d6d0c4}
:root[data-theme="dark"] .tfig img{filter:brightness(.97)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-theme="comfort"]) .tfig{background:#d6d0c4} }
.plain{margin:0; font-size:calc(14px * var(--fs))}
.warn{display:grid; gap:4px; padding:10px 12px; border-radius:8px; background:var(--neg-strip); font-size:calc(14px * var(--fs))}
.warn b{color:var(--neg-ink); font-size:calc(12px * var(--fs)); font-weight:600}
.warn span{display:block}
details.more{border:1px solid var(--border); border-radius:8px}
details.more > summary{display:flex; align-items:center; gap:8px; padding:9px 12px; font-size:calc(13px * var(--fs)); font-weight:600}
details.more > div{padding:0 12px 12px; font-size:calc(14px * var(--fs))}
details.more ul.li{gap:6px}
.bits{margin-top:8px; border:1px solid var(--border); border-radius:8px}
details.bit{border-top:1px solid var(--rule)}
details.bit:first-child{border-top:0}
details.bit > summary{display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:10px; align-items:center; padding:8px 12px; font-size:calc(14px * var(--fs)); font-weight:500}
details.bit > summary:hover{background:var(--raised)}
details.bit[open] > summary{font-weight:600}
.bn{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--raised); color:var(--muted); font-size:calc(12px * var(--fs)); font-weight:600}
.bmax{font-size:calc(12px * var(--fs)); color:var(--muted)}
.bmax::before{content:"עד "}
details.bit[open] .bmax{visibility:hidden}
.bit-b{padding:0 12px 12px; font-size:calc(14px * var(--fs))}
.bins{margin:0 0 8px; color:var(--muted)}
ol.bsc{list-style:none; margin:0; padding:0; display:grid}
ol.bsc li{display:grid; grid-template-columns:24px minmax(0, 1fr); gap:10px; align-items:start; padding:5px 0; border-top:1px solid var(--rule)}
ol.bsc li:first-child{border-top:0}
.bs{text-align:center; font-weight:600; border-radius:4px; background:var(--neu-bg); color:var(--neu-ink); line-height:1.6}
ol.bsc li.g4 .bs{background:var(--pos-bg); color:var(--pos-ink)}
ol.bsc li.g0 .bs{background:var(--neg-bg); color:var(--neg-ink)}
.bnote{margin:8px 0 0; padding:8px 10px; border-radius:6px; background:var(--raised); font-size:calc(13px * var(--fs)); color:var(--muted)}
.evx{margin:0; line-height:1.65}
p.evd{margin:0; padding:8px 12px; border-radius:6px; background:var(--warn-bg); color:var(--warn); font-size:calc(14px * var(--fs)); font-weight:600}
.evx a, .vx a{font-weight:500}
@container panel (max-width:440px){ .rolecards{grid-template-columns:1fr} .rc + .rc{border-inline-start:0; border-top:1px solid var(--border)} }
.tdl{margin:0; display:grid; gap:12px}
.tdl dt{font-size:calc(12px * var(--fs)); font-weight:600; color:var(--muted)}
.tdl dd{margin:2px 0 0}
.tdl .evd{color:var(--warn); font-weight:600}
.vbox{display:grid; gap:8px}
.vid{display:inline-flex; align-items:center; gap:9px; color:var(--text); font-weight:600; text-decoration:none}
.vch{font-size:calc(12px * var(--fs)); color:var(--muted)}
/* embedded YouTube player: 16:9, full panel width, thumbnail until clicked */
.yt{position:relative; aspect-ratio:16 / 9; border-radius:8px; overflow:hidden; background:#1b1a18}
.yt iframe, .ytp{position:absolute; inset:0; width:100%; height:100%; border:0}
.ytp{padding:0; cursor:pointer; background:#1b1a18; display:grid; place-items:center}
.ytp img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.9; transition:opacity .15s}
.ytp:hover img, .ytp:focus-visible img{opacity:1}
.ytb{position:relative; width:56px; height:40px; border-radius:10px; background:rgb(18 18 18 / .78); display:grid; place-items:center; transition:transform .15s}
.ytp:hover .ytb, .ytp:focus-visible .ytb{transform:scale(1.06)}
.ytb svg{width:16px; height:16px; fill:#fff; transform:translateX(2px)}
.ytp:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.vmeta{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.vout{font-size:calc(13px * var(--fs)); font-weight:500; color:var(--accent); text-decoration:none}
.vout:hover{text-decoration:underline}
.vx{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:calc(13px * var(--fs))}
.novid{font-size:calc(13px * var(--fs)); color:var(--muted)}
.uses{display:grid; gap:2px}
.uses button{padding:4px 0; border:0; background:none; color:var(--accent); font-size:calc(14px * var(--fs)); font-weight:500; text-align:start; cursor:pointer}
.uses button:hover{text-decoration:underline}
.uses .ur{color:var(--muted); font-weight:400; font-size:calc(12px * var(--fs))}
.glist{display:grid}
.gi{display:grid; grid-template-columns:96px minmax(0, 1fr); gap:10px; padding:8px 0; border-bottom:1px solid var(--rule)}
.gi .gk{font-weight:600; font-size:calc(14px * var(--fs)); direction:ltr; text-align:right}
.gi .ge{display:block; direction:ltr; text-align:right; font-size:calc(13px * var(--fs)); color:var(--muted)}
.gi .gh{font-size:calc(14px * var(--fs))}

.scrim{position:fixed; inset:0; z-index:30; background:var(--scrim)}

/* ---------- narrower screens ---------- */
/* up to 1180: the panel leaves the sheet and opens as a floating sheet over it */
@media (max-width:1180px){
  .sheet{grid-template-columns:minmax(0, 1fr)}
  .panel{position:fixed; z-index:31; inset-block:8px; inset-inline-end:8px; width:min(440px, calc(100vw - 16px)); border:1px solid var(--border); border-radius:16px; box-shadow:var(--pop-shadow)}
  .panel:not(.shown){display:none}
  .pclose{display:inline-grid}
  .tbtn{display:inline-flex}
  main{padding:24px 28px 88px}
}
/* phone and small tablet: the frame disappears, the sheet is the screen, the sidebar is a menu sheet */
@media (max-width:900px){
  :root{--sm:64px}
  .app{display:block; height:auto}
  header.bar{position:sticky; top:0; grid-template-columns:minmax(0, 1fr) auto; column-gap:8px; height:auto; min-height:var(--bar-h);
    padding:max(0px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-left, 0px)) 0 max(8px, env(safe-area-inset-right, 0px));
    background:var(--ground); border-bottom:1px solid var(--border)}
  .brand{padding:0; gap:8px; height:var(--bar-h)}
  .menu-btn, .search-btn{display:inline-grid}
  .wm{display:none}
  .mark{width:20px; height:20px}
  .bar-title{display:block}
  .search{display:none}

<script>
(function(){
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const root = document.documentElement, app = $("#app");
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.5 9.5 5 1 9.5z"></path></svg>';

// ---------- merge extras into tests ----------
Object.keys(VIDS).forEach(id => { const t = T[id], x = VIDS[id]; if(!t) return; if(x.v) t.v = x.v; t.ch = x.ch; t.vn = x.vn; t.vx = x.vx; });
Object.keys(TEST_GEN).forEach(id => { const t = T[id]; if(t && !t.how){ t.how = TEST_GEN[id].how; t.pos = TEST_GEN[id].pos; t.gen = 1; } });
Object.assign(TX, TX2, TX3);
Object.keys(TX).forEach(id => { if(T[id] && TX[id].evs) T[id].ev = TX[id].evs; });

// ---------- bidi + abbreviations ----------
const TOK = "[A-Za-zÀ-ɏ0-9(/–+&][A-Za-zÀ-ɏ0-9'’°%.\\-–−/+×&:()]*";
const RUN = new RegExp(TOK + "(?: " + TOK + ")*", "g");
const KEYS = Object.keys(ABBR).sort((a, b) => b.length - a.length).map(k => k.replace(/[-]/g, "\\-"));
const ABRE = new RegExp("(^|[^A-Za-z0-9])(" + KEYS.join("|") + ")(?![A-Za-z0-9])", "g");
let SEEN = new Set();
const scope = () => { SEEN = new Set(); };
function fx(s, o){
  if(s == null) return "";
  o = o || {};
  const str = String(s), runs = [];
  const count = (x, c) => x.split(c).length - 1;
  RUN.lastIndex = 0; let mt;
  while((mt = RUN.exec(str))) runs.push([mt.index, mt.index + mt[0].length]);
  const merged = [];
  runs.forEach(r => { const l = merged[merged.length - 1]; if(l && /^ ?[—,] ?$/.test(str.slice(l[1], r[0]))) l[1] = r[1]; else merged.push(r.slice()); });
  let out = "", pos = 0;
  merged.forEach(([a, b]) => {
    let m = str.slice(a, b), pre = "", post = "";
    // an opening bracket or separator at the end of a Latin run belongs to the Hebrew that follows it
    while(/[\s(\/–+&]$/.test(m) && m.trim().length > 1){ post = m.slice(-1) + post; m = m.slice(0, -1); }
    while(m.startsWith("(") && count(m, "(") > count(m, ")")){ pre += "("; m = m.slice(1); }
    while(/[.:)]$/.test(m) && (m.slice(-1) !== ")" || count(m, ")") > count(m, "("))){ post = m.slice(-1) + post; m = m.slice(0, -1); }
    let lead; while((lead = m.match(/^[\/–+&] */))){ pre += lead[0]; m = m.slice(lead[0].length); }
    // a bracket opened inside the run and closed later in Hebrew — e.g. "100% (17 מתוך 17)" — splits the run
    let tail = "";
    { let depth = 0, cut = -1;
      for(let i = 0; i < m.length; i++){ if(m[i] === "("){ if(!depth) cut = i; depth++; } else if(m[i] === ")" && depth){ depth--; if(!depth) cut = -1; } }
      if(cut > 0){ const head = m.slice(0, cut), sp = head.match(/\s*$/)[0]; tail = esc(sp) + fx(m.slice(cut)); m = head.slice(0, head.length - sp.length); } }
    let html;
    if(/[A-Za-zÀ-ɏ0-9]/.test(m)){
      ABRE.lastIndex = 0;
      html = "<bdi>" + esc(m).replace(ABRE, (all, p1, k) => p1 + '<abbr class="ab" data-k="' + k + '">' + k + "</abbr>") + "</bdi>";
    } else html = esc(m);
    out += esc(str.slice(pos, a)) + esc(pre) + html + tail + esc(post);
    pos = b;
  });
  return out + esc(str.slice(pos));
}
const LINK = /\[([^\]]+)\]\((https?:\/\/(?:[^()\s]|\([^()\s]*\))+)\)/g;
const li = arr => '<ul class="li">' + arr.map(x => "<li>" + fx(x) + "</li>").join("") + "</ul>";
function tableHTML(rows, head){
  const [h, ...b] = head ? rows : [null, ...rows];
  return '<div class="tbl"><table>' + (h ? "<thead><tr>" + h.map(c => "<th>" + fx(c) + "</th>").join("") + "</tr></thead>" : "") +
    "<tbody>" + b.map(r => "<tr>" + r.map(c => "<td>" + fx(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
}
function chip(id, i){
  const t = T[id]; if(!t) return "";
  const o = i != null ? '<span class="o">' + (i + 1) + "</span>" : "";
  if(!t.how && !t.v) return '<span class="chip flat">' + o + fx(t.n, { ng: 1 }) + "</span>";
  return '<button class="chip" type="button" data-test="' + id + '">' + o + fx(t.n, { ng: 1 }) + (t.v ? PLAY.replace("<svg", '<svg class="pv"') : "") + "</button>";
}
// in an ordered sequence the arrow travels with the next test, so a wrapped row starts with "← next" instead of ending on a dangling arrow
const chips = (ids, ordered) => '<div class="chips">' + ids.map((id, i) => ordered && i ? '<span class="cg"><span class="arr" aria-hidden="true">←</span>' + chip(id, i) + "</span>" : chip(id, ordered ? i : null)).join("") + "</div>";
function decision(d){
  const yesCls = d.yesGood ? "good" : "bad", noCls = d.yesGood ? "bad" : "good";
  return '<div class="dec"><div class="dec-q"><span class="dia" aria-hidden="true"><span>?</span></span><span>' + fx(d.q) + "</span></div>" +
    '<div class="dec-out"><div class="out ' + yesCls + '"><b>כן</b>' + fx(d.yes) + '</div><div class="out ' + noCls + '"><b>' + esc(d.noLabel || "לא") + "</b>" + fx(d.no) + "</div></div></div>";
}
function histHTML(x){
  const row = (cls, label, v) => v ? '<div class="hr ' + cls + '"><span class="hl">' + label + "</span><span>" + fx(v) + "</span></div>" : "";
  return '<details class="hist"><summary><span class="hs-l">מה השתנה ולמה</span>' + (x.tag ? '<span class="hs-t">' + fx(x.tag) + "</span>" : "") + "</summary>" +
    '<div class="hist-b">' + row("was", "פעם", x.was) + row("now", "היום", x.now) + row("why", "למה שינו", x.why) + row("so", "מה זה משנה למטפל", x.so) + row("dis", "מחלוקת", x.dispute) +
    (x.src ? '<p class="bsrc">' + rich(x.src) + "</p>" : "") + "</div></details>";
}
function blocks(arr){
  if(!arr || !arr.length) return "";
  return '<div class="blocks">' + arr.map(b => {
    if(b.go) return '<div class="blk gob"><button class="golink" type="button" data-go="' + esc(b.go) + '">' + fx(b.h) + " ←</button></div>";
    // a table or a "what changed" box needs the full width; lists sit two to a row
    const cls = "blk" + (b.key ? " key" : "") + (b.stop ? " stopblk" : "") + (b.table || b.hist ? " wide" : "");
    let body = b.p ? "<p>" + fx(b.p) + "</p>" : "";
    if(b.li) body += li(b.li);
    if(b.table) body += tableHTML(b.table, true);
    if(b.post) body += li(b.post);
    if(b.tests) body += chips(b.tests, false);
    if(b.hist) body += histHTML(b.hist);
    if(b.src) body += '<p class="bsrc">' + rich(b.src) + "</p>";
    return '<div class="' + cls + '">' + (b.h ? "<h4>" + fx(b.h) + "</h4>" : "") + body + "</div>";
  }).join("") + "</div>";
}
function station(rid, n, title, sub, inner, flag){
  return '<li class="st' + (flag ? " flag" : "") + '" id="st-' + rid + "-" + n + '" data-n="' + n + '"><div class="num">' + n + '</div><div class="card"><h3>' + fx(title, { ng: 1 }) + "</h3>" +
    (sub ? '<div class="sub">' + fx(sub, { ng: 1 }) + "</div>" : "") + inner + "</div></li>";
}

// ---------- index of where each test is used ----------
const USES = {};
const addUse = (id, u) => { (USES[id] = USES[id] || []).push(u); };
REGIONS.forEach(r => {
  r.s1.checks.forEach((c, i) => (c.tests || []).forEach(id => addUse(id, { kind: "chk", id: "chk-" + r.id + "-" + i, name: c.title, rid: r.id })));
  r.s3.patterns.forEach((pt, pi) => pt.paths.forEach((p, ji) => (p.tests || []).forEach(id => addUse(id, { kind: "path", id: r.id + "-" + pi + "-" + ji, name: p.n, rid: r.id }))));
});
// topic tabs: cross-region knowledge laid out as numbered topics
const TOPIC_TABS = [["found", "עקרונות", FOUND], ["tissue", "רקמות", TISSUE]];
const topicTab = id => TOPIC_TABS.find(t => t[0] === id);
TOPIC_TABS.forEach(([tid, , D]) => D.topics.forEach((tp, i) => tp.blocks.forEach(b => (b.tests || []).forEach(id => addUse(id, { kind: "go", id: "st-" + tid + "-" + (i + 1), name: b.h || tp.t, rid: tid })))));
const regionName = id => topicTab(id) ? topicTab(id)[1] : (REGIONS.find(r => r.id === id) || { name: "מסגרת כללית" }).name;

// ---------- general ----------
function renderGeneral(){
  scope();
  let html = '<section role="tabpanel" id="p-general" aria-labelledby="t-general" hidden><div class="region-head"><h2 class="ttl">מסגרת כללית</h2><p class="lede">' + fx(GENERAL.intro) + '</p></div><ol class="spine">';
  GENERAL.steps.forEach((s, i) => {
    scope();
    let inner = blocks(s.body);
    if(s.dec) inner += decision(s.dec);
    inner += blocks(s.after);
    html += station("general", i + 1, s.t, s.sub, inner, i === 0);
  });
  return html + "</ol></section>";
}

// ---------- foundations ----------
function renderTopics([tid, name, D]){
  scope();
  let html = '<section role="tabpanel" id="p-' + tid + '" aria-labelledby="t-' + tid + '" hidden><div class="region-head"><h2 class="ttl">' + esc(name) + '</h2><p class="lede">' + fx(D.intro) + '</p></div><ol class="spine">';
  D.topics.forEach((tp, i) => { scope(); html += station(tid, i + 1, tp.t, tp.sub, blocks(tp.blocks), !!tp.flag); });
  return html + "</ol></section>";
}
const isGen = id => id === "general" || !!topicTab(id);

// ---------- region ----------
function pathHTML(r, pi, ji, p){
  const id = r.id + "-" + pi + "-" + ji;
  scope();
  let f = "";
  const step = (cls, h, body) => { f += '<div class="fs ' + cls + '"><span class="dot"></span><div><h5>' + h + "</h5>" + body + "</div></div>"; };
  const ab = ABOUT[p.n];
  let about = "";
  if(ab){
    about = '<details class="about"><summary><span class="i" aria-hidden="true">i</span>מה זה? הסבר מורחב</summary><div class="about-b"><p>' + fx(ab.t) + "</p>" +
      "</div></details>";
  }
  if(p.clue) step("", "מה שומעים ורואים", "<p>" + fx(p.clue) + "</p>");
  if(p.tests && p.tests.length){
    let b = chips(p.tests, p.tests.length > 1);
    if(p.order) b += "<p>" + fx(p.order) + "</p>";
    step("", p.tests.length > 1 ? "מבדקים, לפי הסדר" : "מבדק", b);
  }
  if(p.how) step("", "איך בודקים", "<p>" + fx(p.how) + "</p>");
  if(p.pos || p.neg){
    const b = '<div class="pn2">' + (p.pos ? '<div class="pp"><b>חיובי ←</b>' + fx(p.pos) + "</div>" : "") + (p.neg ? '<div class="nn"><b>שלילי ←</b>' + fx(p.neg) + "</div>" : "") + "</div>";
    step("", "מה עושים עם התוצאה", b);
  }
  if(p.grades) step("", "דרגות " + fx("WAD") + " — Quebec Task Force", tableHTML(p.grades, false));
  if(p.steps) step("", "אלגוריתם Whiplash אקוטי", tableHTML(p.steps, false));
  if(p.tx) step("g", "טיפול", "<p>" + fx(p.tx) + "</p>");
  if(p.prog) step("", "פרוגנוזה וחזרה", "<p>" + fx(p.prog) + "</p>");

// ---------- rich text: [label](url) links + patient/therapist colouring ----------
function rich(s){
  if(!s) return "";
  let out = "", last = 0, m; LINK.lastIndex = 0;
  while((m = LINK.exec(s))){
    const label = /[֐-׿]/.test(m[1]) ? fx(m[1]) : "<bdi>" + esc(m[1]) + "</bdi>";
    out += fx(s.slice(last, m.index)) + '<a href="' + esc(m[2]) + '" target="_blank" rel="noopener">' + label + "</a>";
    last = m.index + m[0].length;
  }

}

    h += "<h3>מבדקים: " + esc(r.name) + '</h3><p class="phint">בחירת מבדק, כאן או בתוך מסלול, מציגה מי עושה מה, לפי הסדר, מה מחפשים, ראיות וסרטון הדגמה.</p>' +
      '<div class="tl-h">סינון ובטיחות</div><div class="tlist">' + rt.safety.map(testRow).join("") + "</div>" +
      '<div class="tl-h">מבדקים לפי הפתולוגיות</div><div class="tlist">' + rt.clinical.map(testRow).join("") + "</div>";
  }
  box.innerHTML = h + "</div>";
}
function showPanel(){ if(narrowPanel()){ $("#panel").classList.add("shown"); $("#scrim").hidden = false; } }
function hidePanel(){ $("#panel").classList.remove("shown"); if(!$("#side").classList.contains("open")) $("#scrim").hidden = true; }
function openTest(id){
  if(!T[id]) return;
  ptest = id; renderPanel();
  $$(".chip.on").forEach(c => c.classList.remove("on"));
  $$('.chip[data-test="' + id + '"]').forEach(c => c.classList.add("on"));
  $("#panel").scrollTop = 0; showPanel();
}

// ---------- navigation ----------
function flash(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
function show(id, scroll){
  if(!TABS.some(t => t[0] === id)) id = "general";
  current = id;
  TABS.forEach(([t]) => { $("#p-" + t).hidden = t !== id; $("#t-" + t).setAttribute("aria-selected", String(t === id)); });
  store.set("uqmap-tab", id);
  if(location.hash !== "#" + id){ try{ history.replaceState(null, "", "#" + id); }catch(e){} }
  promoteTitle(id);
  renderOutline();
  renderPanel();
  $("#bar-title").textContent = TABS.find(t => t[0] === id)[1];
  if(scroll){ const sc = scroller(); (sc || window).scrollTo({ top: 0 }); }
  closeNav();
  spy();
}
function promoteTitle(id){
  const swap = (el, tag, cls) => { const n = document.createElement(tag); if(cls) n.className = cls; n.innerHTML = el.innerHTML; el.replaceWith(n); };
  $$(".region-head h1").forEach(h => swap(h, "h2", "ttl"));
  const h = $("#p-" + id + " .region-head .ttl"); if(h) swap(h, "h1");
}
function togglePath(el, open){
  const btn = el.querySelector("button.ph"), body = el.querySelector(".pbody");
  const o = open != null ? open : body.hidden;
  body.hidden = !o; el.classList.toggle("open", o); btn.setAttribute("aria-expanded", String(o));
  btn.querySelector(".tg").textContent = o ? "−" : "+";
}
function goPath(id, openAbout){
  const el = document.getElementById(id); if(!el) return;
  const rid = id.split("-")[0];
  if(current !== rid) show(rid);
  togglePath(el, true);
  if(openAbout){ const d = el.querySelector("details.about"); if(d) d.open = true; }
  el.scrollIntoView({ behavior: "smooth", block: "start" }); flash(el);
  $$(".ol-path").forEach(b => b.classList.toggle("on", b.dataset.path === id));
}
function goChk(id){
  const el = document.getElementById(id); if(!el) return;
  const rid = id.split("-")[1];
  if(current !== rid) show(rid);
  el.open = true; el.scrollIntoView({ behavior: "smooth", block: "start" }); flash(el);
}
function goStation(id){
  const el = document.getElementById(id); if(!el) return;
  const rid = id.split("-")[1];
  if(current !== rid) show(rid);
  el.scrollIntoView({ behavior: "smooth", block: "start" }); flash(el.querySelector(".card"));
}

// scroll spy for the outline and the spine. On a wide screen the page scrolls inside the sheet; on a phone the window does.
const scroller = () => { const m = $("#main"); return getComputedStyle(m).overflowY === "auto" ? m : null; };
let spyRaf = 0;
function spy(){
  cancelAnimationFrame(spyRaf);
  spyRaf = requestAnimationFrame(() => {
    const sts = $$("#p-" + current + " .st"); if(!sts.length) return;
    const sc = scroller();
    const line = (sc ? sc.getBoundingClientRect().top : (parseFloat(getComputedStyle(root).getPropertyValue("--barh")) || 48)) + 120;
    let act = sts[0];
    sts.forEach(s => { if(s.getBoundingClientRect().top <= line) act = s; });
    sts.forEach(s => s.classList.toggle("cur", s === act));
    $$(".ol-st").forEach(b => b.classList.toggle("on", b.dataset.scroll === act.id));
  });
}
window.addEventListener("scroll", spy, { passive: true });
$("#main").addEventListener("scroll", spy, { passive: true });

// ---------- search ----------
const norm = s => String(s || "").toLowerCase().replace(/[״"׳'’`]/g, "").replace(/[־–—\-_\/.,:;()+←↓·]/g, " ").replace(/\s+/g, " ").trim();
const IDX = [];
REGIONS.forEach(r => {
  r.s3.patterns.forEach((pt, pi) => pt.paths.forEach((p, ji) => {
    const ab = ABOUT[p.n] ? ABOUT[p.n].t : "";
    const tn = (p.tests || []).map(id => T[id] ? T[id].n : "").join(" ");
    const keys = []; (p.n + " " + ab).replace(ABRE, (a, x, k) => { keys.push(k + " " + ABBR[k][0] + " " + ABBR[k][1]); return a; });
    IDX.push({ type: "path", id: r.id + "-" + pi + "-" + ji, title: p.n, sub: r.name + " · " + pt.title, body: [p.clue, ab, p.how, p.pos, p.neg, p.tx, p.prog, p.ref, p.order].filter(Boolean).join(" · "), key: [p.clue, p.pos, p.order].filter(Boolean).join(" "), extra: tn + " " + keys.join(" ") });
  }));
  r.s1.checks.forEach((c, i) => {
    const body = [(c.chain || []).map(x => x[0]).join(" "), (c.li || []).join(" "), c.note || "", (c.tests || []).map(id => T[id].n).join(" ")].join(" · ");
    IDX.push({ type: "step", id: "chk-" + r.id + "-" + i, title: c.title, sub: r.name + " · דגלים אדומים", body, extra: "" });
  });
});
Object.keys(T).forEach(id => {
  const t = T[id], u = USES[id] || [];
  const keys = []; String(t.n).replace(ABRE, (a, x, k) => { keys.push(k + " " + ABBR[k][0] + " " + ABBR[k][1]); return a; });
  const x = TX[id] || {}, strip = s => String(s || "").replace(LINK, "$1");
  IDX.push({ type: "test", id, title: t.n, sub: [...new Set((GEN_TESTS.includes(id) ? ["טסטים תפקודיים כלליים"] : []).concat(u.map(x => regionName(x.rid))))].join(" · ") + (t.v ? " · יש סרטון" : ""),
    body: [x.aim, x.pos || t.pos, x.cut ? x.cut.r.map(r => r.join(" ")).join(" · ") : "", t.ev, x.neg, (x.steps || []).map(st => st[1]).join(" "), t.how, (x.tips || []).join(" "), x.items ? x.items.list.map(it => it.t + " " + it.s.join(" ")).join(" ") : "", t.note].filter(Boolean).map(strip).join(" · "), key: x.aim || "", extra: keys.join(" ") + " " + u.map(x => x.name).join(" ") });
});
GENERAL.steps.forEach((s, i) => {
  const all = [].concat(s.body || [], s.after || []).map(b => [b.h || "", (b.li || []).join(" ")].join(" ")).join(" · ") + (s.dec ? " · " + s.dec.q : "");
  IDX.push({ type: "step", id: "st-general-" + (i + 1), title: s.t, sub: "מסגרת כללית · שלב " + (i + 1), body: all, extra: s.sub || "" });
});
TOPIC_TABS.forEach(([tid, name, D]) => D.topics.forEach((tp, i) => {
  const txt = v => Array.isArray(v) ? v.map(txt).join(" ") : v && typeof v === "object" ? Object.values(v).map(txt).join(" ") : String(v || "");
  tp.blocks.forEach(b => IDX.push({ type: tid, id: "st-" + tid + "-" + (i + 1), title: b.h || tp.t, sub: name + " · " + tp.t,
    body: [b.p, txt(b.li), txt(b.table), b.hist ? [b.hist.was, b.hist.now, b.hist.why, b.hist.so, b.hist.dispute].join(" ") : ""].filter(Boolean).join(" · ").replace(LINK, "$1"), extra: "" }));
}));
IDX.forEach(e => { e.nt = norm(e.title); e.nb = norm(e.body); e.nk = norm(e.key || ""); e.nx = norm(e.extra + " " + e.sub); });
const GROUPS = [["path", "פתולוגיות", 8], ["test", "מבדקים", 8], ["found", "עקרונות", 5], ["tissue", "רקמות", 5], ["step", "שלבים ודגלים", 5]];
function snippet(text, terms){
  const low = text.toLowerCase();
  let at = -1, len = 0;
  terms.forEach(t => { const i = low.indexOf(t); if(i >= 0 && (at < 0 || i < at)){ at = i; len = t.length; } });
  if(at < 0) return esc(text.slice(0, 110)) + (text.length > 110 ? "…" : "");
  const s = Math.max(0, at - 40), e = Math.min(text.length, at + len + 70);
  return (s > 0 ? "…" : "") + esc(text.slice(s, at)) + "<mark>" + esc(text.slice(at, at + len)) + "</mark>" + esc(text.slice(at + len, e)) + (e < text.length ? "…" : "");
}
function hl(title, terms){
  const low = title.toLowerCase();
  for(const t of terms){ const i = low.indexOf(t); if(i >= 0) return esc(title.slice(0, i)) + "<mark>" + esc(title.slice(i, i + t.length)) + "</mark>" + esc(title.slice(i + t.length)); }
  return esc(title);
}
let hits = [], sel = -1;
function runSearch(){
  const qv = $("#q").value, q = norm(qv), box = $("#results");
  if(!q){ box.hidden = true; $("#q").setAttribute("aria-expanded", "false"); hits = []; return; }
  const terms = q.split(" ").filter(Boolean);
  const scored = [];
  IDX.forEach(e => {
    let sc = 0;
    for(const t of terms){
      const inT = e.nt.indexOf(t), inB = e.nb.indexOf(t), inX = e.nx.indexOf(t);
      if(inT < 0 && inB < 0 && inX < 0) return;
      sc += inT >= 0 ? (inT === 0 || e.nt[inT - 1] === " " ? 40 : 25) : inX >= 0 ? 14 : e.nk.indexOf(t) >= 0 ? 10 : 6;
    }
    if(e.nt === q) sc += 100; else if(e.nt.startsWith(q)) sc += 30;
    if(e.type === "path") sc += 4;
    scored.push([sc, e]);
  });
  scored.sort((a, b) => b[0] - a[0]);
  const raw = qv.toLowerCase().replace(/[״"׳']/g, "").split(/\s+/).filter(Boolean);
  hits = []; let html = "", best = -1, bestSc = -1;
  GROUPS.forEach(([type, label, max]) => {
    const g = scored.filter(x => x[1].type === type).slice(0, max);
    if(!g.length) return;
    html += '<div class="rgroup" role="group" aria-label="' + label + '"><h6>' + label + "</h6>";
    g.forEach(([scv, e]) => {
      const i = hits.length; hits.push(e);
      if(scv > bestSc){ bestSc = scv; best = i; }
      const snip = e.body ? '<span class="rx">' + snippet(e.body, raw) + "</span>" : "";
      html += '<button type="button" class="res" role="option" id="res-' + i + '" data-hit="' + i + '" aria-selected="false"><span class="rt"><bdi>' + hl(e.title, raw) + '</bdi></span> <span class="rs">' + esc(e.sub) + "</span>" + snip + "</button>";
    });
    html += "</div>";
  });
  box.innerHTML = html || '<div class="rempty">לא נמצא דבר עבור ״' + esc(qv) + "״. אפשר לנסות בעברית או באנגלית, שם של מבדק, תסמין או ראשי תיבות.</div>";
  box.hidden = false; $("#q").setAttribute("aria-expanded", "true");
  sel = hits.length ? best : -1; markSel();
}
function markSel(){
  $$(".res").forEach((b, i) => b.setAttribute("aria-selected", String(i === sel)));
  const cur = $("#res-" + sel);
  if(cur){ cur.scrollIntoView({ block: "nearest" }); $("#q").setAttribute("aria-activedescendant", cur.id); } else $("#q").removeAttribute("aria-activedescendant");
}
function closeResults(){ $("#results").hidden = true; $("#q").setAttribute("aria-expanded", "false"); }
function pick(e){
  closeResults(); $("#q").blur(); $("#bar").classList.remove("searching");
  if(e.type === "path") goPath(e.id, true);
  else if(e.type === "test"){ const u = (USES[e.id] || [])[0]; if(u && current !== u.rid && !isGen(current)) show(u.rid); openTest(e.id); }
  else if(e.id.startsWith("chk-")) goChk(e.id);
  else goStation(e.id);
}
$("#q").addEventListener("input", runSearch);
$("#q").addEventListener("focus", () => { if($("#q").value) runSearch(); });
$("#q").addEventListener("keydown", e => {
  if(e.key === "ArrowDown"){ e.preventDefault(); if(hits.length){ sel = (sel + 1) % hits.length; markSel(); } }
  else if(e.key === "ArrowUp"){ e.preventDefault(); if(hits.length){ sel = (sel - 1 + hits.length) % hits.length; markSel(); } }
  else if(e.key === "Enter"){ e.preventDefault(); if(hits[sel]) pick(hits[sel]); }
  else if(e.key === "Escape"){ if(!$("#results").hidden) closeResults(); else { $("#q").value = ""; $("#q").blur(); endSearch(); } }
});

// ---------- tooltip for abbreviations ----------
const tip = $("#tip");
document.addEventListener("mouseover", e => {
  const a = e.target.closest && e.target.closest("abbr.ab[data-k]");
  if(!a){ tip.hidden = true; return; }
  const k = a.dataset.k, d = ABBR[k]; if(!d) return;
  tip.innerHTML = "<b>" + esc(k) + "</b>: " + esc(d[1]) + '<span class="en">' + esc(d[0]) + "</span>";
  tip.hidden = false;
  const r = a.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(window.innerWidth - w - 8, x));
  let y = r.bottom + 8; if(y + h > window.innerHeight - 8) y = r.top - h - 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
window.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true, capture: true });

// ---------- toggles ----------
const THEMES = ["light", "comfort", "dark"];
const sysDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
function effTheme(){ const t = root.getAttribute("data-theme"); return THEMES.includes(t) ? t : (sysDark() ? "dark" : "light"); }
function syncTheme(){ const t = effTheme(); THEMES.forEach(x => $("#th-" + x).setAttribute("aria-pressed", String(t === x))); }
function setTheme(t){ root.setAttribute("data-theme", t); store.set("uqmap-theme", t); syncTheme(); }
// the eye-comfort view is the default unless the reader chose otherwise (or the system is in dark mode)
const savedTheme = store.get("uqmap-theme");
if(THEMES.includes(savedTheme)) root.setAttribute("data-theme", savedTheme);
else if(!sysDark()) root.setAttribute("data-theme", "comfort");
const FS = ["1", "1.1", "1.2"];
function setFs(v){ if(!FS.includes(v)) v = "1"; root.style.setProperty("--fs", v); $$(".seg.tsize button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.fs === v))); store.set("uqmap-fs", v); measure(); }
setFs(store.get("uqmap-fs") || "1");
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme); }catch(e){}
try{ new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] }); }catch(e){}
syncTheme();
document.addEventListener("toggle", e => { const d = e.target; if(d.matches && d.matches("details.more[data-more]")) store.set("uqmap-more-" + d.dataset.more, d.open ? "1" : "0"); }, true);

// ---------- menu sheet (phone), display popover, phone search ----------
const isPhone = () => matchMedia("(max-width:900px)").matches;
function openNav(){ $("#side").classList.add("open"); $("#menu-btn").setAttribute("aria-expanded", "true"); $("#scrim").hidden = false; }
function closeNav(){ if(!$("#side").classList.contains("open")) return; $("#side").classList.remove("open"); $("#menu-btn").setAttribute("aria-expanded", "false"); if(!$("#panel").classList.contains("shown")) $("#scrim").hidden = true; }
function toggleDisp(open){ const o = open != null ? open : $("#dmenu").hidden; $("#dmenu").hidden = !o; $("#disp-btn").setAttribute("aria-expanded", String(o)); }
function startSearch(){ $("#bar").classList.add("searching"); $("#q").focus(); }
function endSearch(){ $("#bar").classList.remove("searching"); closeResults(); }

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target;
  if(!t.closest(".search")) closeResults();
  if(!t.closest(".dwrap")) toggleDisp(false);
  if(t.closest("#menu-btn")){ $("#side").classList.contains("open") ? closeNav() : openNav(); return; }
  if(t.closest("#disp-btn")){ toggleDisp(); return; }
  if(t.closest("#search-btn")){ startSearch(); return; }
  if(t.closest("#qclose")){ $("#q").value = ""; endSearch(); return; }
  if(t.closest("#tests-btn")){ renderPanel(); $("#panel").scrollTop = 0; showPanel(); return; }
  const res = t.closest("[data-hit]"); if(res){ pick(hits[+res.dataset.hit]); return; }
  const tab = t.closest("[data-tab]"); if(tab){ show(tab.dataset.tab, true); return; }
  const ph = t.closest("button.ph"); if(ph){ togglePath(ph.parentElement); return; }
  if(t.closest("[data-evguide]")){ const g = $("#evg"); if(g){ g.open = true; g.scrollIntoView({block: "start", behavior: "smooth"}); } return; }
  const yt = t.closest("[data-yt]"); if(yt){ yt.parentElement.innerHTML = ytFrame(yt.dataset.yt); return; }
  const tst = t.closest("[data-test]"); if(tst){ openTest(tst.dataset.test); return; }
  if(t.closest("[data-back]")){ ptest = null; $$(".chip.on").forEach(c => c.classList.remove("on")); renderPanel(); return; }
  const pth = t.closest("[data-path]"); if(pth){ goPath(pth.dataset.path); if(narrowPanel() && t.closest("#panel")) hidePanel(); return; }
  const ck = t.closest("[data-chk]"); if(ck){ goChk(ck.dataset.chk); if(narrowPanel()) hidePanel(); return; }
  const sc = t.closest("[data-scroll]"); if(sc){ closeNav(); goStation(sc.dataset.scroll); return; }
  const gl = t.closest("[data-go]"); if(gl){ goStation(gl.dataset.go); return; }
  const ex = t.closest("[data-expand]");
  if(ex){ const paths = $$("#p-" + ex.dataset.expand + " .path"); const anyClosed = paths.some(p => !p.classList.contains("open"));
    paths.forEach(p => togglePath(p, anyClosed)); ex.textContent = anyClosed ? "סגירת כל המסלולים" : "פתיחת כל המסלולים"; return; }
  const thb = t.closest("[data-theme-btn]"); if(thb){ setTheme(thb.dataset.themeBtn); return; }
  const fsb = t.closest("[data-fs]"); if(fsb){ setFs(fsb.dataset.fs); return; }
  if(t.closest("#pclose") || t.id === "scrim"){ hidePanel(); closeNav(); return; }
});
document.addEventListener("keydown", e => {
  const typing = e.target.matches && e.target.matches("input, textarea");
  if(!typing && (e.key === "/" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"))){ e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if(e.key === "Escape"){ toggleDisp(false); closeNav(); if($("#panel").classList.contains("shown")) hidePanel(); if($("#bar").classList.contains("searching") && !typing) endSearch(); }
  if((e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.matches(".reg")){
    e.preventDefault();
    const ids = TABS.map(x => x[0]); let i = ids.indexOf(e.target.dataset.tab);
    i = (i + (e.key === "ArrowDown" ? 1 : -1) + ids.length) % ids.length; show(ids[i], true); $("#t-" + ids[i]).focus();
  }
});
function measure(){ const h = $("#bar").offsetHeight; root.style.setProperty("--barh", (getComputedStyle($("#bar")).position === "sticky" ? h : 0) + "px"); }
window.addEventListener("resize", () => { measure(); if(!narrowPanel()) hidePanel(); if(!isPhone()){ closeNav(); $("#bar").classList.remove("searching"); } });
measure();

let start = (location.hash || "").slice(1);
if(!start) start = store.get("uqmap-tab") || "";
show(start || "general");
})();
</script>
